/* Soft Night, same family as Mission Budget: one phone-width column of rounded cards on charcoal, peach-to-rose gradients, floating pill nav. Single dark theme by design. */
:root{
  --bg:#050506; --card:#141416; --card2:#1C1C20; --track:#222226; --line:#34343A; --fg:#F5F5F5; --muted:#8E8E95; --faint:#6E6E75;
  --a1:#6A4BFF; --a2:#C08BFF;
  --accent:#B79BFF; --accent-ink:#FFFFFF; --accent-tint:rgba(106,75,255,.18); --ok-ink:#050506;
  --ok:#E9E1FF; --ok-tint:rgba(255,255,255,.1); --warn:#F08A80; --warn-tint:rgba(240,138,128,.14); --red:#F08A80; --red-tint:rgba(240,138,128,.14);
  --scrim:rgba(4,4,6,.66); --nav:#18181B; --nav2:#0E0E10; --shadow:rgba(0,0,0,.5); --edge:rgba(255,255,255,.08);
  --surface:linear-gradient(160deg,#18181B 0%,#111113 100%);
  --g-warm:linear-gradient(135deg,#6A4BFF 0%,#C08BFF 100%);
  --g-text:linear-gradient(135deg,#C08BFF 0%,#8A6BFF 100%);
  --g-ok:linear-gradient(135deg,#FFFFFF 0%,#C08BFF 100%);
  --g-hero:radial-gradient(130% 150% at 0% 0%,rgba(106,75,255,.30) 0%,rgba(106,75,255,.08) 45%,rgba(20,20,22,0) 75%),linear-gradient(160deg,#18181B,#0F0F11);
  --g-notice:linear-gradient(135deg,rgba(106,75,255,.20) 0%,rgba(255,255,255,.03) 80%);
  --g-alert:linear-gradient(135deg,rgba(240,96,84,.24) 0%,rgba(255,255,255,.03) 75%);
  --g-glow:radial-gradient(560px 380px at 0% -110px,rgba(106,75,255,.26),rgba(5,5,6,0) 70%),radial-gradient(480px 340px at 100% -60px,rgba(255,255,255,.07),rgba(5,5,6,0) 70%);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--g-glow),var(--bg);background-repeat:no-repeat;color:var(--fg);font-family:var(--font);font-size:15px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:24px 180px;display:flex;flex-direction:column;gap:16px}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head{display:flex;flex-direction:column;gap:2px;min-width:0}
.head .date{font-size:14px;color:var(--muted)}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:12px}
.sechead > span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:24px;padding:20px}
.hero{display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.card.hero{background:var(--g-hero);border:1px solid var(--edge)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 50%,rgba(192,139,255,.42),rgba(192,139,255,0) 62%);opacity:0;pointer-events:none}
.hero.glow::after{animation:glow 1.2s ease-out}
@keyframes glow{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.hero .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--accent);background:var(--g-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;align-self:flex-start}
.big small{font-size:20px;font-weight:700;-webkit-text-fill-color:var(--muted)}
.big.hit{color:var(--ok);background-image:var(--g-ok)}
.sub{font-size:13px;color:var(--muted);line-height:1.45;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ring{flex:none;overflow:visible}
.ring.hzw{width:96px;height:84px;position:relative}
.hzw .hsky{position:absolute;left:0;right:0;top:0;bottom:22px;clip-path:inset(-60px -60px 0 -60px)}
.hzw .hsun{position:absolute;left:50%;width:40px;height:40px;margin-left:-20px;top:54px;border-radius:50%;background:linear-gradient(135deg,#C08BFF,#6A4BFF);box-shadow:0 0 28px rgba(192,139,255,.7);opacity:.4;transition:top .8s cubic-bezier(.3,1.15,.5,1),opacity .6s ease,background .6s ease,box-shadow .6s ease}
.hzw.hit .hsun{background:linear-gradient(135deg,#FFFFFF,#C08BFF);box-shadow:0 0 36px rgba(220,200,255,.9),0 0 70px rgba(192,139,255,.45)}
.hzw .hln{position:absolute;left:0;right:0;bottom:22px;height:2px;border-radius:1px;background:linear-gradient(90deg,rgba(192,139,255,0),#C08BFF,rgba(192,139,255,0))}
.hzw .hticks{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:6px}
.hzw .hticks span{width:14px;height:4px;border-radius:2px;background:var(--track);transition:background .4s ease,box-shadow .4s ease}
.hzw .hticks span.on{background:var(--a2);box-shadow:0 0 8px rgba(192,139,255,.6)}
.badge{width:20px;height:20px;border-radius:10px;background:var(--g-ok);display:inline-grid;place-items:center;color:var(--ok-ink);flex:none}
.badge svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.lastone{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--fg)}
.lastone.warn{background:var(--warn-tint);color:var(--warn)} .lastone.bad{background:var(--red-tint);color:var(--red)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn svg{width:18px;height:18px}
.alert{background:var(--g-alert);border:1px solid rgba(240,96,84,.45);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.ahead{background:none;border:0;width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:center;gap:2px 10px;padding:13px 14px 13px 16px;min-height:56px}
.ahead .aline{grid-column:1;font-size:14px;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahead .achev{grid-column:2;grid-row:1 / span 2;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--fg);transition:transform .2s}
.ahead .achev svg,.planbtn svg{width:16px;height:16px}
.ahead[aria-expanded="true"] .achev{transform:rotate(180deg)}
.abody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.alert .at{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.alert .at svg{width:16px;height:16px}
.alert p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap}
.alert.soon{background:var(--g-notice);border-color:rgba(106,75,255,.35)}
.alert.soon .at{color:var(--accent)}
.must{color:var(--accent);font-weight:700}
.notice{background:var(--g-notice);border:1px solid rgba(106,75,255,.3);color:var(--accent);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;line-height:1.4}
.notice.soft{background:var(--card);border-color:var(--edge);color:var(--fg)}
.notice b{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.notice .nbtns{display:flex;gap:6px;align-items:center;flex:none}
.notice .x{width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--muted)}
.notice .x svg{width:14px;height:14px}
.pillbtn{background:var(--g-warm);color:var(--accent-ink);box-shadow:0 4px 14px rgba(106,75,255,.3);border:0;border-radius:999px;font-weight:700;font-size:13px;padding:8px 14px;min-height:36px;white-space:nowrap}
.pillbtn.ghost{background:var(--card2);color:var(--fg)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--card);border:1px solid transparent;border-radius:16px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.day .dl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.day .dn{font-size:17px;font-weight:700}
.day .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.day .bars i{width:3.5px;border-radius:2px;background:#33333B}
.day .bars i.on{background:var(--fg)}
.day .bars i.mine{background:var(--a2)}
button.day{cursor:pointer}
/* day view */
.dnav{display:flex;align-items:center;gap:8px}
.dnav .navb{width:38px;height:38px;border-radius:19px;border:0;background:var(--card2);display:grid;place-items:center;color:var(--fg);flex:none;padding:0}
.dnav .navb svg{width:16px;height:16px}
.dnav .t{flex:1;min-width:0;text-align:center}
.dnav .t b{display:block;font-size:18px;font-weight:800}
.dnav .t span{font-size:12px;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.rate.l{background:rgba(127,214,166,.14);color:#9FE3BD}.rate.m{background:rgba(232,194,122,.14);color:#E8C27A}.rate.p{background:var(--red-tint);color:var(--red)}
.bz{width:7px;height:7px;border-radius:4px;flex:none}
.bz.l{background:#7FD6A6}.bz.m{background:#E8C27A}.bz.p{background:var(--red)}
.sumrow small{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.calnote{font-size:12.5px;color:var(--muted);background:var(--card2);border-radius:12px;padding:9px 12px;line-height:1.45}
.alldays{display:flex;flex-wrap:wrap;gap:6px}
.alldays span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--fg)}
.alldays span.mine{background:var(--accent-tint);color:var(--accent)}
.tl{position:relative}
.tl .hr{position:absolute;left:0;right:0;height:1px;background:var(--track)}
.tl .hr span{position:absolute;left:0;top:-7px;font-size:10px;color:var(--faint);width:42px;background:var(--card);padding-right:2px}
.tl .ev{position:absolute;left:46px;right:2px;border-radius:10px;padding:5px 9px;font-size:11.5px;line-height:1.3;overflow:hidden;text-align:left}
.tl .ev b{display:block;font-size:12.5px}
.tl .ev.cal{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#CFCFD6}
.tl .ev.cal b{color:#fff}
.tl .ev.mine{background:linear-gradient(135deg,rgba(106,75,255,.42),rgba(192,139,255,.2));border:1px solid rgba(192,139,255,.6);color:#fff}
.tl .ev.mine.over{border-color:#E8C27A}
.tl .ev.ghost{background:linear-gradient(135deg,rgba(106,75,255,.3),rgba(192,139,255,.12));border:1.5px dashed var(--a2);color:#fff}
.tl .ev.ghost.over{border-color:#E8C27A}
.tl .ev.gap{background:none;border:1.5px dashed rgba(127,214,166,.45);color:#9FE3BD;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tl .ev.gap[aria-pressed="true"]{background:rgba(127,214,166,.08)}
.tl .ev.gap b{display:inline;font-size:12.5px;color:#9FE3BD}
.tl .ev.gap .plus{width:26px;height:26px;border-radius:13px;background:rgba(127,214,166,.16);display:grid;place-items:center;flex:none}
.tl .ev.gap .plus svg{width:13px;height:13px}
.tl .now{position:absolute;left:42px;right:0;height:2px;background:var(--red);z-index:2}
.tl .now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:4px;background:var(--red)}
.tl .bed{position:absolute;left:42px;right:0;height:0;border-top:2px dashed #E8C27A;z-index:1}
.tl .bed span{position:absolute;right:2px;top:-18px;font-size:10px;font-weight:800;color:#E8C27A;background:var(--card);padding:0 4px;border-radius:4px}
.tl .late{position:absolute;left:42px;right:0;background:repeating-linear-gradient(135deg,rgba(232,194,122,.06) 0 6px,transparent 6px 12px)}
.dtray{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -18px calc(-20px - env(safe-area-inset-bottom,0px));background:var(--card2);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;box-shadow:0 -12px 26px rgba(0,0,0,.45);z-index:3;touch-action:none}
.dtray .tgrab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px;cursor:grab}
.dtray .tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dtray .tt b{font-size:14px}
.dtray .tt span{font-size:12px;color:var(--muted)}
.dtray .ideas{display:flex;flex-direction:column;gap:7px;max-height:210px;overflow:auto}
.idea{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.idea .cic{margin:0}
.idea b{font-size:14px;font-weight:600;display:block}
.idea small{font-size:11.5px;color:var(--muted)}
.idea[aria-pressed="true"]{border-color:var(--a2);background:linear-gradient(135deg,rgba(106,75,255,.25),rgba(192,139,255,.08)),var(--card)}
.bedwarn{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:#E8C27A;background:rgba(232,194,122,.1);border:1px solid rgba(232,194,122,.3);border-radius:12px;padding:9px 11px;margin:0}
.bedwarn svg{width:15px;height:15px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gconn{display:flex;flex-direction:column;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px}
.gconn b{font-size:14px}
.gconn span{font-size:12px;color:var(--muted);line-height:1.45}
.gconn .row{display:flex;gap:8px}
.gconn .row button{flex:1;min-height:42px;border-radius:999px;border:0;font-weight:700;font-size:13.5px;background:var(--card);color:var(--fg)}
.gconn .row button.pri{background:var(--g-warm);color:#fff}
.day.today{background:linear-gradient(180deg,#1E1C26,var(--card)) padding-box,var(--g-warm) border-box;border:1.5px solid transparent}
.day.today .dl{color:var(--accent)}
.day.past{opacity:.5}
button.day:active{background:var(--card2)}

/* rows */
.list{display:flex;flex-direction:column;gap:10px}
.arow{background:var(--surface);border:1px solid var(--edge);border-radius:18px;display:flex;align-items:stretch;gap:2px;padding-left:10px;overflow:hidden;transition:box-shadow .3s}
.arow.glow{box-shadow:0 0 0 1.5px var(--a2),0 0 26px -6px var(--a1)}
.amain{flex:1;min-width:0;background:none;border:0;text-align:left;display:grid;grid-template-columns:16px minmax(0,1fr);gap:12px;align-items:start;padding:14px 12px 14px 8px;border-radius:18px}
.amain:active{background:var(--card2)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--gc,var(--muted));flex:none;margin-top:5px}
.cic{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted);display:grid;place-items:center}
.cic svg,.chip svg.ic,.prow .cic svg{width:16px;height:16px}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.atxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.t1{font-size:15px;font-weight:600;overflow-wrap:anywhere;position:relative;align-self:flex-start;transition:color .3s}
.t1::after{content:"";position:absolute;left:-2px;right:-2px;top:54%;height:2px;border-radius:1px;background:var(--g-warm);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.struck .t1{color:var(--muted)}
.struck .t1::after{transform:scaleX(1)}
.t2{font-size:12px;color:var(--muted)}
.t2.late{color:var(--warn)}
.t3{font-size:13px;color:var(--muted);line-height:1.45;white-space:pre-line}
.t3.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.plan{margin-top:6px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;color:var(--fg);line-height:1.5;white-space:pre-line}
.plan b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
.tag svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.tag.must{background:var(--accent-tint);color:var(--accent)}
.tag.late{background:var(--warn-tint);color:var(--warn)}
.tag.cal{background:var(--ok-tint);color:var(--ok)}
.aside{display:flex;flex-direction:column;gap:6px;padding:12px 10px 12px 0;flex:none}
.movebtn svg{width:16px;height:16px}
.planbtn{width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s}
.planbtn[aria-expanded="true"]{transform:rotate(180deg);color:var(--fg)}
details.hw{background:var(--card2);border-radius:14px;padding:0 14px}
details.hw summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-weight:700;font-size:14px;color:var(--fg)}
details.hw summary::-webkit-details-marker{display:none}
details.hw summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.hw[open] summary::after{transform:rotate(-135deg)}
details.hw p{margin:0 0 14px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.oncal{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font-weight:700}
.oncal svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.donebtn{position:relative;align-self:center;width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:var(--muted);flex:none;padding:0;transition:transform .12s,border-color .2s}
.donebtn::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--g-warm);transform:scale(0);transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.donebtn.mint::before{background:var(--g-ok)}
.donebtn.mint.on{color:var(--ok-ink)}
.donebtn svg{width:18px;height:18px;position:relative;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.donebtn:hover{border-color:var(--a2);color:var(--a2)}
.donebtn.press{transform:scale(.86)}
.donebtn.on{border-color:transparent;color:var(--accent-ink)}
.donebtn.on::before{transform:scale(1)}
.donebtn.on path{animation:draw .3s .12s both}
@keyframes draw{from{stroke-dasharray:24;stroke-dashoffset:24}to{stroke-dasharray:24;stroke-dashoffset:0}}
.flydot{position:fixed;width:14px;height:14px;border-radius:7px;background:var(--g-warm);box-shadow:0 0 16px rgba(140,100,255,.8);pointer-events:none;z-index:40}
.flydot.mint{background:var(--g-ok);box-shadow:0 0 16px rgba(220,200,255,.8)}
.empty{color:var(--muted);font-size:14px;padding:4px 2px;line-height:1.5}
.gtitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:6px 2px 0}
.logcard{background:var(--surface);border:1px solid var(--edge);border-radius:18px;padding:2px 16px}
.logrow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;width:100%;background:none;border:0;text-align:left}
.logrow + .logrow{border-top:1px solid var(--track)}
.logrow .chev{color:var(--faint);align-self:center}
.logrow .chev svg{width:15px;height:15px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid transparent;background:var(--card2);border-radius:999px;min-height:38px;padding:7px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip.dotted::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--gc)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--g-notice);color:var(--accent)}
.chip:disabled{opacity:.35}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters .chip{flex:none;background:var(--card)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--edge);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0;z-index:10;pointer-events:none}
.nav .in{position:relative;pointer-events:auto;margin:0;height:calc(60px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--nav),var(--nav2));border:0;border-top:1px solid var(--edge);border-radius:0;box-shadow:0 -6px 24px var(--shadow);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:0 max(6px,calc(50% - 226px)) env(safe-area-inset-bottom,0px)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;min-height:52px;border-radius:24px;padding:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--a2)}

  // ---------- derived ----------

  }

  // ---------- bedtime + duration ----------

  function bars(){
    const g = S.settings.goal, ws0 = weekStart(today()), weeks = [];

    const max = Math.max(g, ...weeks.map((w) => w.n), 1);
    const W = 320, H = 120, top = 14, bot = 22, plotH = H - top - bot, bw = 24, gap = (W - 8 * bw) / 8;

    });

        }
        else if (e.type === "deleted") { t = "Deleted " + nm; cls = "del"; const gone = !S.acts.some((a) => a.id === e.actId); act = e.snap ? `<button type="button" class="act" data-hrestore="${esc(e.id)}" ${gone ? "" : "disabled"}>${gone ? "Restore" : "Restored"}</button>` : ""; }
        else if (e.type === "completed") { t = "Completed " + nm; cls = "done"; const l = S.log.find((x) => x.id === e.logId); act = l && l.prev ? `<button type="button" class="act" data-hputback="${esc(l.id)}">Put back</button>` : ""; }
        else if (e.type === "undone") { t = "Put back " + nm; if (e.to) meta += " · " + (e.to === "Ideas" ? "back in Ideas" : "back on " + esc(e.to)); }

        else if (e.type === "restored") { t = e.actId ? "Restored " + nm : esc(e.text || "Restored a backup"); }
        else if (e.type === "settings") { t = esc(e.text || "Changed settings"); }
        h += `<div class="hev"><span class="bub ${cls}">${HICON[e.type] || HICON.settings}</span><span class="tx"><span class="t">${t}</span>${diff}<span class="m">${meta}</span></span>${act || "<span></span>"}</div>`;
      });
      h += `</div>`;

    return h;
  }
  const TABS = ["week", "ideas", "done", "hist"];
  function placeInd(instant){

  // iOS fix: after the keyboard closes (or the app resumes), iOS can leave the page shifted, which makes the

  function repin(){

      const vv = window.visualViewport;

      window.scrollTo(window.scrollX, window.scrollY);

  // ---------- calendar sync (Google Calendar connector, one-way) ----------

  function calErr(e){

  function findId(p){
    try {
      if (typeof p === "string"){
        try { p = JSON.parse(p); } catch (e){ const m = p.match(/"?(?:eventId|id)"?\s*[:=]\s*"?([A-Za-z0-9_\-]{6,})/); return m ? m[1] : ""; }
      }
      if (!p || typeof p !== "object") return "";
      for (const k of ["eventId", "id"]) if (typeof p[k] === "string" && p[k]) return p[k];
      for (const k of ["event", "result", "data", "item"]) if (p[k] && typeof p[k] === "object"){ const r = findId(p[k]); if (r) return r; }
    } catch (e){}
    return "";
  }
  function evBody(a){

      endTime = localStamp(new Date(s.getTime() + durOf(a) * 3600e3));

  // ---- Google sign-in for the GitHub (standalone) version ----

  let dayRedraw = null;
  const CHL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  const CHR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  function openDay(ds){
    let cur = ds, gapSel = null, ideaSel = null;
    const sh = openSheet(`<div id="dv" style="display:flex;flex-direction:column;gap:12px"></div>`, "Day schedule");
    const box = sh.querySelector("#dv");
    sh.parentElement._onClose = () => { dayRedraw = null; };
    const fmtD = (d) => DOW[dowIdx(parse(d))] + ", " + short(parse(d));
    function plansOn(d){ return openActs().filter((x) => x.date === d); }
    function gapsOn(d, blocks){
      const B = bedH(), ev = blocks.slice().sort((a, b) => a[0] - b[0]), out = [];
      let t = 8;
      if (d === iso(today())){ const n = new Date(); t = Math.max(t, Math.ceil((n.getHours() + n.getMinutes() / 60) * 2) / 2); }
      ev.forEach((e) => { if (e[0] - t >= 1.5) out.push([t, e[0]]); t = Math.max(t, e[1]); });
      if (B - t >= 1.5) out.push([t, B]);
      return out;
    }
    function draw(){
      loadCal(weekStart(parse(cur)));
      const B = bedH(), END = Math.ceil(B + .5), PX = 36, y = (hh) => (hh - 8) * PX;
      const cal = S.cal[cur] || [], calTimed = cal.filter((e) => !e.allDay), calAll = cal.filter((e) => e.allDay);
      const plans = plansOn(cur), timed = plans.filter((x) => x.time), untimed = plans.filter((x) => !x.time);
      const done = S.log.filter((l) => l.date === cur);
      const blocks = calTimed.map((e) => [e.s, e.e]).concat(timed.map((x) => [hourOf(x.time), hourOf(x.time) + durOf(x)]));
      const hrs = bookedOn(cur), planned = timed.reduce((t, x) => t + durOf(x), 0), tot = hrs + planned, cnt = calTimed.length + timed.length;
      const rk = tot > 6 || cnt >= 4 ? ["p", "Packed"] : tot >= 3 ? ["m", "Moderate"] : ["l", "Light"];
      const gaps = gapsOn(cur, blocks);
      const st = calLoaded[iso(weekStart(parse(cur)))];
      let note = "";
      if (!calReady()) note = STANDALONE ? "Connect Google Calendar in Settings to see your events here. For now this shows your own plans." : "";
      else if (STANDALONE && !gLive()) note = "Google sign-in expired. Tap Reconnect in Settings > Calendar to see your events.";
      else if (st === "loading" || st === undefined) note = "Loading your calendar…";
      else if (st === "err") note = esc(S.calErrMsg || "Couldn't load your calendar.");
      let tl = "";
      for (let hh = 8; hh <= END; hh++) tl += `<div class="hr" style="top:${y(hh)}px"><span>${hh % 2 === 0 || hh === END ? fmtH(hh).replace(":00", "") : ""}</span></div>`;
      tl += `<div class="late" style="top:${y(B)}px;height:${y(END) - y(B)}px"></div><div class="bed" style="top:${y(B)}px"><span>Bedtime ${fmtTime(S.settings.bed || "00:30")}</span></div>`;
      tl += calTimed.map((e) => `<div class="ev cal" style="top:${y(Math.max(8, e.s)) + 1}px;height:${Math.max(18, y(Math.min(END, e.e)) - y(Math.max(8, e.s)) - 2)}px"><b>${esc(e.title)}</b>${fmtH(e.s)} – ${fmtH(e.e)}</div>`).join("");
      tl += timed.map((x) => { const s0 = hourOf(x.time), e0 = s0 + durOf(x), over = e0 > B; return `<button type="button" class="ev mine${over ? " over" : ""}" data-edit="${esc(x.id)}" style="top:${y(Math.max(8, s0)) + 1}px;height:${Math.max(20, y(Math.min(END, e0)) - y(Math.max(8, s0)) - 2)}px"><b>${esc(x.name)}</b>${fmtH(s0)} – ${fmtH(e0)} · Your plan${over ? " · past bedtime" : ""}</button>`; }).join("");
      gaps.forEach((g, k) => {
        if (gapSel === k && ideaSel != null){
          const it = ideasList()[ideaSel], e0 = g[0] + durOf(it), over = e0 > B;
          tl += `<div class="ev ghost${over ? " over" : ""}" style="top:${y(g[0]) + 1}px;height:${y(Math.min(END, e0)) - y(g[0]) - 2}px"><b>${esc(it.name)}</b>${fmtH(g[0])} – ${fmtH(e0)} · preview</div>`;
        } else tl += `<button type="button" class="ev gap" data-gap="${k}" aria-pressed="${gapSel === k}" style="top:${y(g[0]) + 3}px;height:${y(g[1]) - y(g[0]) - 6}px"><span><b>Open</b> · ${fmtH(g[0])} – ${fmtH(g[1])}</span><span class="plus">${PLUS}</span></button>`;
      });
      if (cur === iso(today())){ const n = new Date(), nh = n.getHours() + n.getMinutes() / 60; if (nh >= 8 && nh <= END) tl += `<div class="now" style="top:${y(nh)}px"></div>`; }
      let hd = `<div class="headrow dnav"><button type="button" class="navb" data-dstep="-1" aria-label="Previous day">${CHL}</button><span class="t"><b>${esc(fmtD(cur))}</b><span>${cur === iso(today()) ? "Today · " : ""}${cnt} on the schedule</span></span><button type="button" class="navb" data-dstep="1" aria-label="Next day">${CHR}</button><button type="button" class="iconbtn" data-close aria-label="Close" style="width:38px;height:38px">${IC.close}</button></div>
        <div class="sumrow"><span class="rate ${rk[0]}"><span class="bz ${rk[0]}"></span>${rk[1]}</span><small>${Math.round(hrs * 10) / 10} hr booked${planned ? " + " + planned + " hr planned" : ""} · ${gaps.length} open</small></div>
        <div class="meter"><i style="width:${Math.min(100, tot / (B - 8) * 100)}%;background:${rk[0] === "p" ? "var(--red)" : rk[0] === "m" ? "#E8C27A" : "#7FD6A6"}"></i></div>`;
      if (note) hd += `<div class="calnote">${note}</div>`;
      if (calAll.length || untimed.length || done.length) hd += `<div class="alldays">${calAll.map((e) => `<span>All day · ${esc(e.title)}</span>`).join("")}${untimed.map((x) => `<span class="mine">${esc(x.name)} · no time yet</span>`).join("")}${done.map((l) => `<span class="mine">✓ ${esc(l.name)}</span>`).join("")}</div>`;
      hd += `<div class="tl" style="height:${y(END) + 14}px">${tl}</div>`;
      if (gapSel != null && gaps[gapSel]){
        const g = gaps[gapSel], list = ideasList();
        const it = ideaSel != null ? list[ideaSel] : null, e0 = it ? g[0] + durOf(it) : 0;
        const next = it ? blocks.filter((b) => b[0] >= g[0]).sort((a, b) => a[0] - b[0])[0] : null;
        let warn = "";
        if (it && e0 > B) warn = bedMsg(e0);
        else if (it && next && e0 > next[0] + 1e-6) warn = `<p class="bedwarn">${IC.alert}<span>Runs into something else at ${fmtH(next[0])}.</span></p>`;
        hd += `<div class="dtray" id="dtray"><div class="tgrab" aria-hidden="true"></div><div class="tt"><b>Plan into ${fmtH(g[0])} – ${fmtH(g[1])}</b><span>${Math.round((g[1] - g[0]) * 10) / 10} hr free</span></div>
          ${list.length ? `<div class="ideas">${list.map((x, i) => `<button type="button" class="idea" data-idea="${i}" aria-pressed="${ideaSel === i}">${cic(x.cat)}<span><b>${esc(x.name)}</b><small>${esc(catOf(x.cat).name)} · about ${durLabel(durOf(x))}</small></span></button>`).join("")}</div>` : `<p class="hint" style="margin:0">No ideas waiting. Add one with the + button.</p>`}
          ${warn}
          <button type="button" class="save" id="dv-add" ${it ? "" : "disabled"}>${!it ? "Pick an idea" : warn ? "Add anyway" : "Add to " + DOW[dowIdx(parse(cur))] + " at " + fmtH(g[0])}</button></div>`;
      } else hd += `<div style="height:8px"></div>`;
      box.innerHTML = hd;
      const tray = box.querySelector("#dtray");
      if (tray) wireTray(tray);
    }
    const ideasList = () => openActs().filter((x) => !x.date).sort(waitingSort).slice(0, 8);
    function wireTray(tray){
      let y0 = null, cur2 = 0, v = 0, ly = 0, lt = 0;
      tray.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; y0 = e.clientY; ly = y0; lt = performance.now(); cur2 = 0; v = 0; try { tray.setPointerCapture(e.pointerId); } catch (er){} });
      tray.addEventListener("pointermove", (e) => { if (y0 == null) return; const d = e.clientY - y0, n = performance.now(); v = (e.clientY - ly) / Math.max(1, n - lt); ly = e.clientY; lt = n; cur2 = Math.max(-10, d); tray.style.transform = `translateY(${cur2}px)`; });
      const end = () => { if (y0 == null) return; y0 = null; tray.style.transform = ""; if (cur2 > 70 || v > .5){ gapSel = null; ideaSel = null; draw(); } };
      tray.addEventListener("pointerup", end); tray.addEventListener("pointercancel", end);
    }
    dayRedraw = draw;
    box.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.dstep){ cur = iso(addDays(parse(cur), Number(b.dataset.dstep))); gapSel = null; ideaSel = null; draw(); sfx("tab"); return; }
      const into = (el) => { if (!el) return; const sr = sh.getBoundingClientRect(), r = el.getBoundingClientRect(); sh.scrollTo({top: sh.scrollTop + r.top - sr.top - 150, behavior: RM ? "auto" : "smooth"}); };
      if (b.dataset.gap != null && b.classList.contains("gap")){ const k = Number(b.dataset.gap); gapSel = gapSel === k ? null : k; ideaSel = null; const keep = sh.scrollTop; draw(); sh.scrollTop = keep; if (gapSel != null) into(box.querySelector(".ev.gap[aria-pressed=true]")); return; }
      if (b.dataset.idea != null){ ideaSel = Number(b.dataset.idea); const keep = sh.scrollTop; draw(); sh.scrollTop = keep; into(box.querySelector(".ev.ghost")); return; }
      if (b.dataset.edit){ openEdit(b.dataset.edit); return; }
      if (b.id === "dv-add"){
        const g = gapsOn(cur, (S.cal[cur] || []).filter((x) => !x.allDay).map((x) => [x.s, x.e]).concat(plansOn(cur).filter((x) => x.time).map((x) => [hourOf(x.time), hourOf(x.time) + durOf(x)])))[gapSel];

        draw();
      }
    });
    draw();
  }

  // ---------- Sunday planning ----------
  function openSunday(){
    const si = sunInfo(); if (!si) return;
    const P = {step:1, picks:[], days:{}};
    const ideas = openActs().filter((x) => !x.date).sort(waitingSort);
    const tIso = iso(today());
    const days = Array.from({length:7}, (_, i) => addDays(si.ws, i));
    const ago = (s) => { const n = Math.round((today() - parse(s)) / 864e5); return n <= 0 ? "today" : n === 1 ? "yesterday" : n < 14 ? n + " days ago" : Math.round(n / 7) + " weeks ago"; };
    function suggest(){
      const used = new Set();
      P.picks.forEach((id) => {
        if (P.days[id] != null){ used.add(P.days[id]); return; }
        const x = S.acts.find((a) => a.id === id);
        const order = x && x.cat === "outdoors" ? [5, 6, 4, 2, 3, 1, 0] : [2, 3, 1, 4, 5, 6, 0];
        const k = order.find((i) => !used.has(i) && iso(days[i]) >= tIso);
        P.days[id] = k == null ? 6 : k; used.add(P.days[id]);
      });
    }
    const sh = openSheet(`<div id="sun-body" style="display:flex;flex-direction:column;gap:14px"></div>`, "Plan the week");
    const body = sh.querySelector("#sun-body");
    function draw(){

    const al = app.querySelector(".alert[role=alert]");
    if (al){
      await new Promise((r) => setTimeout(r, full ? 420 : 300));
      sfx("alert");
      await al.animate([{opacity:0, transform:"translateY(-16px)"},{opacity:1, transform:"none"}], {duration:300, easing:"cubic-bezier(.2,.9,.3,1.2)", fill:"backwards"}).finished;
      al.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(-3px)"},{transform:"translateX(0)"}], {duration:320});
    }
  }
  async function intro(){
    let full = !RM && store.get("twa_intro") !== iso(today());
    if (full){
      store.set("twa_intro", iso(today()));
      const exit = playSplash();
      await new Promise((r) => setTimeout(r, 40));
      await exit;
      reveal(true);
    } else {
      await Promise.race([S.readyP, new Promise((r) => setTimeout(r, 1500))]);
      reveal(false);
    }
  }

  // re-check the calendar when you come back to the app
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || S.status !== "live") return;
    calLoaded = {}; loadCal(weekStart(today())); loadCal(addDays(weekStart(today()), 7));
  });

  // ---------- boot ----------
  render();
  requestAnimationFrame(() => placeInd(true));
  intro();
  (async () => {
    let db = null;
    if (STANDALONE) db = localDb();
    else try { db = await window.claude.use("db"); } catch (e){ db = null; }
    if (!db){ S.status = "offline"; render(); readyRes(); return; }
    S.db = db;
    const ready = () => {
      if (S.got.acts && S.got.log && S.status === "loading"){
        S.status = "live"; readyRes();
        setTimeout(() => { loadCal(weekStart(today())); loadCal(addDays(weekStart(today()), 7)); }, 300);
        const last = snaps()[0];
        if ((S.acts.length || S.log.length) && (!last || iso(new Date(last.at)) !== iso(today()))) setTimeout(() => takeSnap("Daily"), 1500);
      }
    };
    let pruned = false;
    db.collection("hist").onSnapshot((snap) => {
      S.hist = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      if (!pruned){ pruned = true; const cut = Date.now() - 90 * 864e5; S.hist.filter((h) => h.ts < cut).slice(0, 30).forEach((h) => db.doc("hist/" + h.id).delete().catch(() => {})); }
      if (S.tab === "hist"){ if (!sheetEl) render(); else S.pending = true; }
    }, () => {});
    db.collection("acts").onSnapshot((snap) => {
      S.acts = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      S.got.acts = true; ready(); if (!sheetEl) render(); else S.pending = true;
    }, () => { S.status = "offline"; render(); readyRes(); });
    db.collection("log").onSnapshot((snap) => {
      S.log = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      S.got.log = true; ready(); if (!sheetEl) render(); else S.pending = true;
    }, () => { S.got.log = true; ready(); render(); });
    db.doc("config/settings").onSnapshot((snap) => {
      if (snap.exists){
        const v = snap.data() || {}, g = Number(v.goal), nd = Number(v.nudge);
        if (g >= 1 && g <= 7) S.settings.goal = g;
        if (nd >= 2 && nd <= 7) S.settings.nudge = nd;
        if (typeof v.calDefault === "boolean") S.settings.calDefault = v.calDefault;
        if (typeof v.bed === "string" && /^\d{2}:\d{2}$/.test(v.bed)) S.settings.bed = v.bed;
        if (typeof v.sound === "boolean") S.settings.sound = v.sound;
      }
      if (!sheetEl) render(); else S.pending = true;
    }, () => {});
  })();
})();
</script>
