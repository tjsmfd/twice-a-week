/* Soft Night, same family as Mission Budget: one phone-width column of rounded cards on charcoal, peach-to-rose gradients, floating pill nav. Single dark theme by design. */
:root{
  --bg:#050506; --card:#141416; --card2:#1C1C20; --track:#222226; --line:#34343A; --fg:#F5F5F5; --muted:#8E8E95; --faint:#6E6E75;
  --a1:#6A4BFF; --a2:#C08BFF;
  --accent:#B79BFF; --accent-ink:#FFFFFF; --accent-tint:rgba(106,75,255,.18); --ok-ink:#050506;
  --ok:#E9E1FF; --ok-tint:rgba(255,255,255,.1); --warn:#F0A35E; --warn-tint:rgba(240,163,94,.14); --amber:#F0A35E; --gold:#F2CF7A; --red:#F08A80; --red-tint:rgba(240,138,128,.14);
  --scrim:rgba(4,4,6,.66); --nav:#18181B; --nav2:#0E0E10; --shadow:rgba(0,0,0,.5); --edge:rgba(255,255,255,.08);
  --surface:linear-gradient(160deg,#18181B 0%,#111113 100%);
  --g-warm:linear-gradient(135deg,#6A4BFF 0%,#C08BFF 100%);
  --g-text:linear-gradient(135deg,#C08BFF 0%,#8A6BFF 100%);
  --g-ok:linear-gradient(135deg,#FFFFFF 0%,#C08BFF 100%);
  --g-hero:radial-gradient(130% 150% at 0% 0%,rgba(106,75,255,.30) 0%,rgba(106,75,255,.08) 45%,rgba(20,20,22,0) 75%),linear-gradient(160deg,#18181B,#0F0F11);
  --g-notice:linear-gradient(135deg,rgba(106,75,255,.20) 0%,rgba(255,255,255,.03) 80%);
  --g-alert:linear-gradient(135deg,rgba(240,96,84,.24) 0%,rgba(255,255,255,.03) 75%);
  --g-glow:radial-gradient(560px 380px at 0% -110px,rgba(106,75,255,.26),rgba(5,5,6,0) 70%),radial-gradient(480px 340px at 100% -60px,rgba(255,255,255,.07),rgba(5,5,6,0) 70%);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iOS 26 home-screen bug (WebKit 301108): the viewport comes up short by the status-bar height. Making the page
   at least screen-tall gives fixed elements the full screen again. The min() cap avoids extra scroll elsewhere. */
@media (display-mode: standalone){ html{min-height:min(100lvh, calc(100% + env(safe-area-inset-top,0px)))} }
body{background:var(--g-glow),var(--bg);background-repeat:no-repeat;color:var(--fg);font-family:var(--font);font-size:15px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:24px 180px;display:flex;flex-direction:column;gap:16px}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head{display:flex;flex-direction:column;gap:2px;min-width:0}
.head .date{font-size:14px;color:var(--muted)}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:12px}
.sechead > span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:24px;padding:20px}
.hero{display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.card.hero{background:var(--g-hero);border:1px solid var(--edge)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 50%,rgba(192,139,255,.42),rgba(192,139,255,0) 62%);opacity:0;pointer-events:none}
.hero.glow::after{animation:glow 1.2s ease-out}
@keyframes glow{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.hero .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--accent);background:var(--g-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;align-self:flex-start}
.big small{font-size:20px;font-weight:700;-webkit-text-fill-color:var(--muted)}
.big.hit{color:var(--ok);background-image:var(--g-ok)}
.sub{font-size:13px;color:var(--muted);line-height:1.45;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ring{flex:none;overflow:visible}
.ring.hzw{width:96px;height:84px;position:relative}
.hzw .hsky{position:absolute;left:0;right:0;top:0;bottom:22px;clip-path:inset(-60px -60px 0 -60px)}
.hzw .hsun{position:absolute;left:50%;width:40px;height:40px;margin-left:-20px;top:54px;border-radius:50%;background:linear-gradient(135deg,#C08BFF,#6A4BFF);box-shadow:0 0 28px rgba(192,139,255,.7);opacity:.4;transition:top .8s cubic-bezier(.3,1.15,.5,1),opacity .6s ease,background .6s ease,box-shadow .6s ease}
.hzw.hit .hsun{background:linear-gradient(135deg,#FFFFFF,#C08BFF);box-shadow:0 0 36px rgba(220,200,255,.9),0 0 70px rgba(192,139,255,.45)}
.hzw .hln{position:absolute;left:0;right:0;bottom:22px;height:2px;border-radius:1px;background:linear-gradient(90deg,rgba(192,139,255,0),#C08BFF,rgba(192,139,255,0))}
.hzw .hticks{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:6px}
.hzw .hticks span{width:14px;height:4px;border-radius:2px;background:var(--track);transition:background .4s ease,box-shadow .4s ease}
.hzw .hticks span.on{background:var(--a2);box-shadow:0 0 8px rgba(192,139,255,.6)}
.badge{width:20px;height:20px;border-radius:10px;background:var(--g-ok);display:inline-grid;place-items:center;color:var(--ok-ink);flex:none}
.badge svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.lastone{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--fg)}
.lastone.warn{background:var(--warn-tint);color:var(--warn)} .lastone.bad{background:var(--red-tint);color:var(--red)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn svg{width:18px;height:18px}
.alert{background:var(--g-alert);border:1px solid rgba(240,96,84,.45);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.ahead{background:none;border:0;width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:center;gap:2px 10px;padding:13px 14px 13px 16px;min-height:56px}
.ahead .aline{grid-column:1;font-size:14px;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahead .achev{grid-column:2;grid-row:1 / span 2;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--fg);transition:transform .2s}
.ahead .achev svg,.planbtn svg{width:16px;height:16px}
.ahead[aria-expanded="true"] .achev{transform:rotate(180deg)}
.abody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.alert .at{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.alert .at svg{width:16px;height:16px}
.alert p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap}
.alert.soon{background:var(--g-notice);border-color:rgba(106,75,255,.35)}
.alert.soon .at{color:var(--accent)}
.must{color:var(--accent);font-weight:700}
.notice{background:var(--g-notice);border:1px solid rgba(106,75,255,.3);color:var(--accent);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;line-height:1.4}
.notice.soft{background:var(--card);border-color:var(--edge);color:var(--fg)}
.notice b{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.notice .nbtns{display:flex;gap:6px;align-items:center;flex:none}
.notice .x{width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--muted)}
.notice .x svg{width:14px;height:14px}
.pillbtn{background:var(--g-warm);color:var(--accent-ink);box-shadow:0 4px 14px rgba(106,75,255,.3);border:0;border-radius:999px;font-weight:700;font-size:13px;padding:8px 14px;min-height:36px;white-space:nowrap}
.pillbtn.ghost{background:var(--card2);color:var(--fg)}

/* week strip */
.stripwrap{position:relative;margin:0 -18px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 18px;scroll-padding:0 18px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip .day{flex:0 0 calc((100% - 36px - 36px) / 7);scroll-snap-align:start}
.strip .day.wk{margin-left:10px}
.strip .wkl{flex:none;align-self:stretch;display:flex;align-items:center;margin:0 -2px 0 6px}
.strip .wkl span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a2);opacity:.8}
.striphint{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:-8px}
.striphint b{color:var(--muted);font-weight:600}
.day{background:var(--card);border:1px solid transparent;border-radius:16px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.day .dl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.day .dn{font-size:17px;font-weight:700}
.day .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.day .bars i{width:3.5px;border-radius:2px;background:#33333B}
.day .bars i.on{background:var(--fg)}
.day .bars i.mine{background:var(--a2)}
button.day{cursor:pointer}
/* day view */
.dnav{display:flex;align-items:center;gap:8px}
.dnav .navb{width:38px;height:38px;border-radius:19px;border:0;background:var(--card2);display:grid;place-items:center;color:var(--fg);flex:none;padding:0}
.dnav .navb svg{width:16px;height:16px}
.dnav .t{flex:1;min-width:0;text-align:center}
.dnav .t b{display:block;font-size:18px;font-weight:800}
.dnav .t span{font-size:12px;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.rate.l{background:rgba(127,214,166,.14);color:#9FE3BD}.rate.m{background:rgba(240,163,94,.14);color:#F0A35E}.rate.p{background:var(--red-tint);color:var(--red)}
.bz{width:7px;height:7px;border-radius:4px;flex:none}
.bz.l{background:#7FD6A6}.bz.m{background:#F0A35E}.bz.p{background:var(--red)}
.sumrow small{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.calnote{font-size:12.5px;color:var(--muted);background:var(--card2);border-radius:12px;padding:9px 12px;line-height:1.45}
.alldays{display:flex;flex-wrap:wrap;gap:6px}
.alldays span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--fg)}
.alldays span.mine{background:var(--accent-tint);color:var(--accent)}
.tl{position:relative}
.dprev{margin-top:14px;background:var(--card2);border-radius:16px;padding:12px 12px 4px}
.dprev .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.dprev .ph b{font-size:13.5px}
.dprev .ph small{font-size:11.5px;color:var(--muted)}
.dprev .pn{font-size:11.5px;color:var(--muted);margin:0 0 8px;line-height:1.4}
.dprev .tl .hr span{background:var(--card2)}
.dprev .tl .bed span{background:var(--card2)}
.dprev .tl .ev{padding:2px 8px;font-size:10.5px;border-radius:8px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dprev .tl .ev b{display:inline;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.dprev .tl .ev.gap{padding:2px 8px}
.dprev .tl .ev.gap .plus{width:20px;height:20px}
.dprev .warnp{font-size:12px;color:#F0A35E;margin:6px 0 8px;display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.dprev .warnp svg{width:14px;height:14px;flex:none;margin-top:1px}
.dprev .alld{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.dprev .alld span{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06)}
.tl .hr{position:absolute;left:0;right:0;height:1px;background:var(--track)}
.tl .hr span{position:absolute;left:0;top:-7px;font-size:10px;color:var(--faint);width:42px;background:var(--card);padding-right:2px}
.tl .ev{position:absolute;left:46px;right:2px;border-radius:10px;padding:5px 9px;font-size:11.5px;line-height:1.3;overflow:hidden;text-align:left}
.tl .ev b{display:block;font-size:12.5px}
.tl .ev.cal{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#CFCFD6}
.tl .ev.cal b{color:#fff}
.tl .ev.mine{background:linear-gradient(135deg,rgba(106,75,255,.42),rgba(192,139,255,.2));border:1px solid rgba(192,139,255,.6);color:#fff}
.tl .ev.mine.over{border-color:#F0A35E}
.tl .ev.ghost{background:linear-gradient(135deg,rgba(106,75,255,.3),rgba(192,139,255,.12));border:1.5px dashed var(--a2);color:#fff}
.tl .ev.ghost.over{border-color:#F0A35E}
.tl .ev.gap{background:none;border:1.5px dashed rgba(127,214,166,.45);color:#9FE3BD;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tl .ev.gap[aria-pressed="true"]{background:rgba(127,214,166,.08)}
.tl .ev.gap b{display:inline;font-size:12.5px;color:#9FE3BD}
.tl .ev.gap .plus{width:26px;height:26px;border-radius:13px;background:rgba(127,214,166,.16);display:grid;place-items:center;flex:none}
.tl .ev.gap .plus svg{width:13px;height:13px}
.tl .now{position:absolute;left:42px;right:0;height:2px;background:var(--red);z-index:2}
.tl .now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:4px;background:var(--red)}
.tl .bed{position:absolute;left:42px;right:0;height:0;border-top:2px dashed #F0A35E;z-index:1}
.tl .bed span{position:absolute;right:2px;top:-18px;font-size:10px;font-weight:800;color:#F0A35E;background:var(--card);padding:0 4px;border-radius:4px}
.tl .late{position:absolute;left:42px;right:0;background:repeating-linear-gradient(135deg,rgba(240,163,94,.06) 0 6px,transparent 6px 12px)}
.dtray{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -18px calc(-20px - env(safe-area-inset-bottom,0px));background:var(--card2);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;box-shadow:0 -12px 26px rgba(0,0,0,.45);z-index:3;touch-action:none}
.dtray .tgrab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px;cursor:grab}
.dtray .tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dtray .tt b{font-size:14px}
.dtray .tt span{font-size:12px;color:var(--muted)}
.dtray .ideas{display:flex;flex-direction:column;gap:7px;max-height:280px;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.dsearch{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;min-height:40px}
.dsearch svg{width:15px;height:15px;color:var(--muted);flex:none}
.dsearch input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:16px;padding:8px 0;outline:none}
.igh{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.igh:first-child{margin-top:0}
.itag{margin-left:auto;flex:none;font-size:10.5px;font-weight:800;color:#F0A35E;background:rgba(240,163,94,.14);padding:3px 8px;border-radius:999px;white-space:nowrap}
.idea > span:not(.itag):not(.cic){min-width:0;flex:1;text-align:left}
.igh > span:first-child{display:inline-flex;align-items:center;gap:6px}
.igh svg{width:13px;height:13px;flex:none}
.idea > span:not(.cic) b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inone{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}
.wkpick{background:var(--card2);border-radius:16px;padding:10px 10px 8px}
.wkpick .wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wkpick .wh b{font-size:13.5px}
.wkpick .wh button{width:32px;height:32px;border-radius:16px;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.wkpick .wh button svg{width:16px;height:16px}
.wkpick .wh button:disabled{opacity:.3}
.wkdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wkd{background:var(--card);border:1.5px solid transparent;border-radius:11px;padding:6px 2px 5px;text-align:center;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.wkd b{font-size:15px;color:var(--fg);font-weight:700}
.wkd .bars{position:relative;width:calc(100% - 8px);height:38px;margin-top:4px;background:rgba(255,255,255,.035);border-radius:5px;overflow:hidden}
.wkd .bars i{position:absolute;left:2px;right:2px;border-radius:2px;background:rgba(255,255,255,.2)}
.wkd .bars i.m{background:rgba(192,139,255,.55)}
.wkd .fit{font-size:9px;font-weight:800;color:#7FD6A6;margin-top:3px;min-height:11px}
.wkd .fit.no{color:var(--faint,#5E5E65);font-weight:600}
.wkd[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.08)}
.wkd.td b{color:var(--a2)}
.wkd:disabled{opacity:.35}
.wkpick .wl{font-size:11px;color:var(--muted);margin:7px 2px 0;display:flex;gap:12px}
.wkpick .wl span{display:inline-flex;align-items:center;gap:5px}
.wkpick .wl i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.2);display:inline-block}
.wkpick .wl i.m{background:rgba(192,139,255,.55)}
.idea{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.idea .cic{margin:0}
.idea b{font-size:14px;font-weight:600;display:block}
.idea small{font-size:11.5px;color:var(--muted)}
.idea[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.08)}
.bedwarn{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:#F0A35E;background:rgba(240,163,94,.1);border:1px solid rgba(240,163,94,.3);border-radius:12px;padding:9px 11px;margin:0}
.bedwarn svg{width:15px;height:15px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gconn{display:flex;flex-direction:column;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px}
.gconn b{font-size:14px}
.gconn span{font-size:12px;color:var(--muted);line-height:1.45}
.gconn .row{display:flex;gap:8px}
.gconn .row button{flex:1;min-height:42px;border-radius:999px;border:0;font-weight:700;font-size:13.5px;background:var(--card);color:var(--fg)}
.gconn .row button.pri{background:var(--g-warm);color:#fff}
.gconn .gas{border-top:1px solid var(--edge);padding-top:10px}
.gconn .gas summary{font-size:13.5px;font-weight:700;color:var(--a2);cursor:pointer}
.gconn .gas p,.gconn .gas li{font-size:12.5px;color:var(--muted);line-height:1.5}
.gconn .gas ol{margin:8px 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.gconn .gas b{font-size:12.5px;color:var(--fg)}
.gconn .gas .pillbtn{min-height:30px;padding:5px 12px;font-size:12px}
.gconn .gas .field{margin-bottom:8px}
.day.today{background:linear-gradient(180deg,#1E1C26,var(--card)) padding-box,var(--g-warm) border-box;border:1.5px solid transparent}
.day.today .dl{color:var(--accent)}
.day.past{opacity:.5}
button.day:active{background:var(--card2)}

/* rows */
.list{display:flex;flex-direction:column;gap:10px}
.arow{background:var(--surface);border:1px solid var(--edge);border-radius:18px;display:flex;align-items:stretch;gap:2px;padding-left:10px;overflow:hidden;transition:box-shadow .3s}
.arow.glow{box-shadow:0 0 0 1.5px var(--a2),0 0 26px -6px var(--a1)}
.amain{flex:1;min-width:0;background:none;border:0;text-align:left;display:grid;grid-template-columns:16px minmax(0,1fr);gap:12px;align-items:start;padding:14px 12px 14px 8px;border-radius:18px}
.amain:active{background:var(--card2)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--gc,var(--muted));flex:none;margin-top:5px}
.cic{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted);display:grid;place-items:center}
.cic svg,.chip svg.ic,.prow .cic svg{width:16px;height:16px}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.atxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.t1{font-size:15px;font-weight:600;overflow-wrap:anywhere;position:relative;align-self:flex-start;transition:color .3s}
.t1::after{content:"";position:absolute;left:-2px;right:-2px;top:54%;height:2px;border-radius:1px;background:var(--g-warm);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.struck .t1{color:var(--muted)}
.struck .t1::after{transform:scaleX(1)}
.t2{font-size:12px;color:var(--muted)}
.t2.late{color:var(--warn)}
.t3{font-size:13px;color:var(--muted);line-height:1.45;white-space:pre-line}
.t3.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.plan{margin-top:6px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;color:var(--fg);line-height:1.5;white-space:pre-line}
.plan b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
.tag svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.tag.must{background:var(--accent-tint);color:var(--accent)}
.tag.late{background:var(--warn-tint);color:var(--warn)}
.tag.cal{background:var(--ok-tint);color:var(--ok)}
.aside{display:flex;flex-direction:column;gap:6px;padding:12px 10px 12px 0;flex:none}
.movebtn svg{width:16px;height:16px}
.planbtn{width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s}
.planbtn[aria-expanded="true"]{transform:rotate(180deg);color:var(--fg)}
details.hw{background:var(--card2);border-radius:14px;padding:0 14px}
details.hw summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-weight:700;font-size:14px;color:var(--fg)}
details.hw summary::-webkit-details-marker{display:none}
details.hw summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.hw[open] summary::after{transform:rotate(-135deg)}
details.hw p{margin:0 0 14px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.oncal{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font-weight:700}
.oncal svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.donebtn{position:relative;align-self:center;width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:var(--muted);flex:none;padding:0;transition:transform .12s,border-color .2s}
.donebtn::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--g-warm);transform:scale(0);transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.donebtn.mint::before{background:var(--g-ok)}
.donebtn.mint.on{color:var(--ok-ink)}
.donebtn svg{width:18px;height:18px;position:relative;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.donebtn:hover{border-color:var(--a2);color:var(--a2)}
.donebtn.press{transform:scale(.86)}
.donebtn.on{border-color:transparent;color:var(--accent-ink)}
.donebtn.on::before{transform:scale(1)}
.donebtn.on path{animation:draw .3s .12s both}
@keyframes draw{from{stroke-dasharray:24;stroke-dashoffset:24}to{stroke-dasharray:24;stroke-dashoffset:0}}
.flydot{position:fixed;width:14px;height:14px;border-radius:7px;background:var(--g-warm);box-shadow:0 0 16px rgba(140,100,255,.8);pointer-events:none;z-index:40}
.flydot.mint{background:var(--g-ok);box-shadow:0 0 16px rgba(220,200,255,.8)}
.empty{color:var(--muted);font-size:14px;padding:4px 2px;line-height:1.5}
.gtitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:6px 2px 0}
.logcard{background:var(--surface);border:1px solid var(--edge);border-radius:18px;padding:2px 16px}
.logrow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;width:100%;background:none;border:0;text-align:left}
.logrow + .logrow{border-top:1px solid var(--track)}
.logrow .chev{color:var(--faint);align-self:center}
.logrow .chev svg{width:15px;height:15px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid transparent;background:var(--card2);border-radius:999px;min-height:44px;padding:8px 15px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip.dotted::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--gc)}
.chip[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 .5px #fff}
.chip:disabled{opacity:.35}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters .chip{flex:none;background:var(--card)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--edge);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700}

/* nav */
:root{--navb:calc(6px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;padding:26px 0 var(--navb);z-index:10;pointer-events:none;background:linear-gradient(180deg,rgba(5,5,6,0) 0%,rgba(5,5,6,.92) 38%,var(--bg) 100%)}
.nav .in{position:relative;pointer-events:auto;max-width:452px;margin:0 auto;height:54px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:0 6px}
.tab{position:relative;z-index:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;height:50px;padding:0;transition:color .25s}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--a2)}
.nav .ind{position:absolute;left:0;bottom:0;width:20px;height:2.5px;border-radius:2px;background:var(--a2);box-shadow:0 0 8px rgba(192,139,255,.8);transition:transform .45s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.iconbtn.flag{position:relative}
.iconbtn.flag::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:4px;background:var(--amber);box-shadow:0 0 0 2px var(--bg)}
/* ghost-text pickers */
.pk{position:relative}
.pkv{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:10px 40px 10px 12px;min-height:44px;font-size:15px;color:var(--fg)}
.pkv.ghost{color:var(--faint)}
.pkv svg{width:17px;height:17px;flex:none;color:var(--muted)}
.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;margin:0;padding:0;-webkit-appearance:none;appearance:none;font-size:16px}
.pk:focus-within .pkv{border-color:var(--a2)}
.pkx{position:absolute;right:7px;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:30px;border-radius:15px;border:0;background:rgba(255,255,255,.08);color:var(--muted);display:grid;place-items:center;padding:0}
.pkx svg{width:12px;height:12px}
/* history */
.hday{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.feed{background:var(--surface);border:1px solid var(--edge);border-radius:18px;padding:2px 14px}
.hev{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.hev + .hev{border-top:1px solid var(--track)}
.hev .bub{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--fg)}
.hev .bub svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hev .bub.done{background:var(--g-warm);color:#fff}
.hev .bub.del{background:var(--red-tint);color:var(--red)}
.hev .tx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.hev .t{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.hev .m{font-size:12px;color:var(--muted)}
.hev .diff{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.hev .diff s{color:var(--faint)}
.hev .diff i{font-style:normal;color:var(--accent);font-weight:700}
.hev .act{font-size:13px;font-weight:800;color:var(--accent);background:none;border:0;padding:6px 2px;min-height:36px}
.hev .act:disabled{color:var(--faint)}
/* data */
.dataline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px}
.dataline b{display:block;font-size:14px}
.dataline span{font-size:12px;color:var(--muted)}
.warnchip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid rgba(240,163,94,.45);color:var(--amber);white-space:nowrap}
.savebtn2{display:flex;align-items:center;justify-content:center;gap:8px}
.savebtn2 svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.snaps{background:var(--card2);border-radius:14px;padding:2px 14px}
.snaps .hev .bub{background:rgba(255,255,255,.05)}
.fab{position:fixed;right:max(18px,calc(50% - 222px),env(safe-area-inset-right,0px));bottom:calc(var(--navb) + 74px);z-index:11;width:58px;height:58px;border-radius:29px;border:0;background:var(--g-warm);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px var(--shadow),0 6px 20px rgba(106,75,255,.4)}
.fab svg{width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:480px;max-height:92%;overflow:auto;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet .grab{width:40px;height:5px;background:var(--track);border-radius:3px;align-self:center}
.sheet .iconbtn{background:var(--card2)}
.sheet .chip{background:var(--card2)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;display:block}
.field{background:var(--card2);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-height:44px;width:100%;color:var(--fg)}
.field:focus{border-color:var(--accent);outline:none}
.field::placeholder{color:var(--faint)}
textarea.field{min-height:92px;resize:vertical;line-height:1.45}
.namefield{background:none;border:0;font-size:24px;font-weight:700;width:100%;color:var(--fg);padding:0;caret-color:var(--accent)}
.namefield:focus{outline:none}
.namefield::placeholder{color:var(--line)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px}
.typetog{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:999px;padding:4px}
.typetog button{background:none;border:0;border-radius:999px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.typetog button[aria-pressed="true"]{background:var(--g-warm);color:var(--accent-ink)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.save{background:var(--g-warm);color:var(--accent-ink);border:0;border-radius:999px;min-height:52px;font-size:16px;font-weight:700;width:100%}
.save.ghost{background:var(--card2);color:var(--fg)}
.save:disabled{opacity:.4}
.btnrow{display:flex;gap:8px}
.btnrow > button{flex:1;min-height:46px;border-radius:999px;border:0;font-weight:700;font-size:14px;background:var(--card2);color:var(--fg)}
.btnrow > button.ok{background:var(--ok-tint);color:var(--ok)}
.btnrow > button.danger.armed{background:var(--red-tint);color:var(--red)}
.btnrow > .save{flex:1}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:22px;border:0;background:var(--card2);font-size:22px;font-weight:700}
.stepper .n{font-size:32px;font-weight:800;min-width:40px;text-align:center;color:var(--accent);background:var(--g-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.setblock{display:flex;flex-direction:column;gap:10px}
.setblock + .setblock{border-top:1px solid var(--track);padding-top:16px}
.how{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;color:var(--muted)}
.how b{color:var(--fg)}
.togrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px 14px}
.togrow b{font-size:14px;font-weight:700;display:block}
.togrow span{font-size:12px;color:var(--muted)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;border:0;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--fg);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--g-ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* sunday planner */
.shh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shh span{font-size:13px;color:var(--muted)}
.prow{width:100%;border:1.5px solid transparent;background:var(--card2);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:16px minmax(0,1fr) 24px;gap:12px;align-items:center;text-align:left}
.prow > i{width:10px;height:10px;border-radius:5px;background:var(--gc)}
.prow .ptx{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .ptx b{font-size:15px;font-weight:600}
.prow .ptx span{font-size:12px;color:var(--muted)}
.prow .pc{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.prow .pc svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.prow[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.08)}
.prow[aria-pressed="true"] .pc{background:var(--g-warm);border-color:transparent}
.prow[aria-pressed="true"] .pc svg{opacity:1}
.prow:disabled{opacity:.4}
.dblock{display:flex;flex-direction:column;gap:8px}
.dblock .nm{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.dblock .nm i{width:10px;height:10px;border-radius:5px;background:var(--gc)}
.dchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dc{min-height:48px;border-radius:12px;border:0;background:var(--card2);font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.dc b{font-size:15px;color:var(--fg)}
.dc[aria-pressed="true"]{background:var(--g-warm);color:var(--accent-ink)}
.dc[aria-pressed="true"] b{color:var(--accent-ink)}
.dc:disabled{opacity:.3}
.setcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.setcard .big2{font-size:24px;font-weight:800}
.syncline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--card2);border-radius:14px;padding:11px 13px;line-height:1.4}
.syncline svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--ok);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navb) + 144px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;width:max-content;max-width:min(440px,calc(100vw - 32px));display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px var(--shadow)}
.toast .tm{line-height:1.35;flex:1 1 auto;min-width:0}
.toast button{border:0;background:none;color:#5B3FE0;font-weight:800;font-size:14px;padding:4px 2px;min-height:32px;white-space:nowrap}

/* opening: horizon + wordmark */
.splash{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer}
.splash .sbg{position:absolute;inset:0;background:var(--g-glow),var(--bg);background-repeat:no-repeat}
.splash .dawn{position:absolute;inset:0;background:radial-gradient(75% 42% at 50% 56%,rgba(106,75,255,.36),rgba(106,75,255,.08) 50%,rgba(5,5,6,0) 76%);opacity:0}
.splash .sky{position:absolute;left:0;right:0;top:0;height:56%;overflow:hidden}
.splash .sun{position:absolute;left:50%;bottom:-78px;width:68px;height:68px;margin-left:-34px;border-radius:50%;background:linear-gradient(135deg,#C08BFF,#6A4BFF);box-shadow:0 0 48px rgba(106,75,255,.65)}
.splash .hz{position:absolute;left:max(12%,calc(50% - 180px));right:max(12%,calc(50% - 180px));top:56%;height:2px;border-radius:1px;background:linear-gradient(90deg,rgba(106,75,255,0),#C08BFF,rgba(106,75,255,0));box-shadow:0 0 16px rgba(140,100,255,.7);transform:scaleX(0)}
.splash .wm{position:absolute;left:0;right:0;top:calc(56% + 22px);display:flex;flex-direction:column;align-items:center;gap:8px}
.splash .w1{font-size:40px;font-weight:800;letter-spacing:0;display:flex;gap:.28em;align-items:baseline}
.splash .lt{display:inline-block;background:linear-gradient(135deg,#C08BFF 0%,#8A6BFF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0}
.splash .aw{opacity:0}
.splash .tag{font-size:14px;color:var(--muted);opacity:0}
.sheet .grab,.sheet .headrow{touch-action:none}
/* ===== night sky (1A) ===== */
#nightsky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
body{background:var(--bg)}
:root{--card:rgba(20,20,22,.84); --card2:rgba(30,30,34,.9); --surface:linear-gradient(160deg,rgba(24,24,27,.86) 0%,rgba(17,17,19,.86) 100%)}
.sheet{background:#141416}
/* ===== star check-off (1D) ===== */
.svig{position:fixed;inset:0;z-index:38;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,rgba(5,5,6,0) 30%,rgba(5,3,14,.72) 100%);opacity:0}
.sblink{position:fixed;z-index:42;width:0;height:0;pointer-events:none}
.sblink svg{position:absolute;left:-46px;top:-46px;width:92px;height:92px;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #C08BFF)}
.sblink i{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:2px solid rgba(233,221,255,.9);box-shadow:0 0 18px rgba(192,139,255,.8)}
.sflight{position:fixed;inset:0;width:100%;height:100%;z-index:41;pointer-events:none}
/* ===== living horizon hero (2A–2E) ===== */
.card.hero.scn{padding:0;display:block;min-height:184px;background:#0B0720;isolation:isolate}
.scn .ring.hzw{position:absolute;inset:0;width:auto;height:auto;z-index:0}
.scn .wsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scn .hsky{position:absolute;left:0;right:0;top:0;bottom:34%;clip-path:inset(-120px -120px 0 -120px);z-index:1}
.scn .hsun{left:22%;width:40px;height:40px;margin-left:-20px}
.scn.night .hsun{background:radial-gradient(circle at 38% 36%,#FFFFFF 0%,#E8E2FA 55%,#B7AADF 100%);box-shadow:0 0 30px rgba(220,210,255,.55)}
.scn.night .hzw.hit .hsun{box-shadow:0 0 42px rgba(230,220,255,.9),0 0 90px rgba(192,139,255,.4)}
.scn .hln{display:none}
.scn .hticks{left:22%;right:auto;transform:translateX(-50%);bottom:9px;z-index:2}
.scn .hticks span{background:rgba(255,255,255,.18)}
.scn .txt{position:relative;z-index:3;min-height:184px;padding:16px 16px 14px 46%;display:flex;flex-direction:column;justify-content:center;gap:4px}
.scn .txt::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,5,6,0) 32%,rgba(5,5,6,.5) 62%,rgba(5,5,6,.62) 100%)}
.scn .sub{color:#CFCFD6}
.scn .wtag{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#D9C6FF;opacity:.85}
.wsvg .fall,.skysvg .fall{animation:wfall 7s linear infinite}

  // Busy blocks and open gaps for a day (calendar events + timed plans), used by the week picker and day preview.
  function dayBlocks(ds, skipId){

    const mine = openActs().filter((a) => a.date === ds && a.time && a.id !== skipId).map((a) => [hourOf(a.time), hourOf(a.time) + durOf(a), a.name, "m"]);
    return cal.concat(mine);
  }
  function openGaps(ds, blocks, minLen){
    const B = bedH(), ev = blocks.slice().sort((a, b) => a[0] - b[0]), out = [];

    if (ds === iso(today())){ const n = new Date(); t = Math.max(t, Math.ceil((n.getHours() + n.getMinutes() / 60) * 2) / 2); }
    ev.forEach((e) => { if (e[0] - t >= minLen) out.push([t, e[0]]); t = Math.max(t, e[1]); });
    if (B - t >= minLen) out.push([t, B]);
    return out;
  }

  // Shared actions for a task (details "…" menu and touch-and-hold menu).
  function actItems(x, withOpen){

  async function runAct(x, k, btn){

  // Details first: tapping a task shows a read-only card. Edit and the rest live in the "…" menu.

  let holdFired = false;

    timeIn.addEventListener("change", redraw);

    sh.parentElement._onClose = () => { dayRedraw = null; };
    redraw();
    sh.querySelector("#m-save").addEventListener("click", () => {

  }

  let dayRedraw = null;
  const CHL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  const CHR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  function openDay(ds){
    let cur = ds, gapSel = null, ideaSel = null, q = "";
    const sh = openSheet(`<div id="dv" style="display:flex;flex-direction:column;gap:12px"></div>`, "Day schedule");
    const box = sh.querySelector("#dv");
    sh.parentElement._onClose = () => { dayRedraw = null; };
    const fmtD = (d) => DOW[dowIdx(parse(d))] + ", " + short(parse(d));
    function plansOn(d){ return openActs().filter((x) => x.date === d); }
    function gapsOn(d, blocks){
      const B = bedH(), ev = blocks.slice().sort((a, b) => a[0] - b[0]), out = [];
      let t = 8;
      if (d === iso(today())){ const n = new Date(); t = Math.max(t, Math.ceil((n.getHours() + n.getMinutes() / 60) * 2) / 2); }
      ev.forEach((e) => { if (e[0] - t >= 1.5) out.push([t, e[0]]); t = Math.max(t, e[1]); });
      if (B - t >= 1.5) out.push([t, B]);
      return out;
    }
    function draw(){
      loadCal(weekStart(parse(cur)));
      const B = bedH(), END = Math.ceil(B + .5), PX = 36, y = (hh) => (hh - 8) * PX;
      const cal = S.cal[cur] || [], calTimed = cal.filter((e) => !e.allDay), calAll = cal.filter((e) => e.allDay);
      const plans = plansOn(cur), timed = plans.filter((x) => x.time), untimed = plans.filter((x) => !x.time);
      const done = S.log.filter((l) => l.date === cur);
      const blocks = calTimed.map((e) => [e.s, e.e]).concat(timed.map((x) => [hourOf(x.time), hourOf(x.time) + durOf(x)]));
      const hrs = bookedOn(cur), planned = timed.reduce((t, x) => t + durOf(x), 0), tot = hrs + planned, cnt = calTimed.length + timed.length;
      const rk = tot > 6 || cnt >= 4 ? ["p", "Packed"] : tot >= 3 ? ["m", "Moderate"] : ["l", "Light"];
      const gaps = gapsOn(cur, blocks);
      const st = calLoaded[iso(weekStart(parse(cur)))];
      let note = "";
      if (!calReady()) note = STANDALONE ? "Connect Google Calendar in Settings to see your events here. For now this shows your own plans." : "";
      else if (STANDALONE && !gOn()) note = "Google sign-in expired. Tap Reconnect in Settings > Calendar to see your events.";
      else if (st === "loading" || st === undefined) note = "Loading your calendar…";
      else if (st === "err") note = esc(S.calErrMsg || "Couldn't load your calendar.");
      let tl = "";
      for (let hh = 8; hh <= END; hh++) tl += `<div class="hr" style="top:${y(hh)}px"><span>${hh % 2 === 0 || hh === END ? fmtH(hh).replace(":00", "") : ""}</span></div>`;
      tl += `<div class="late" style="top:${y(B)}px;height:${y(END) - y(B)}px"></div><div class="bed" style="top:${y(B)}px"><span>Bedtime ${fmtTime(S.settings.bed || "00:30")}</span></div>`;
      tl += calTimed.map((e) => `<div class="ev cal" style="top:${y(Math.max(8, e.s)) + 1}px;height:${Math.max(18, y(Math.min(END, e.e)) - y(Math.max(8, e.s)) - 2)}px"><b>${esc(e.title)}</b>${fmtH(e.s)} – ${fmtH(e.e)}</div>`).join("");
      tl += timed.map((x) => { const s0 = hourOf(x.time), e0 = s0 + durOf(x), over = e0 > B; return `<button type="button" class="ev mine${over ? " over" : ""}" data-edit="${esc(x.id)}" style="top:${y(Math.max(8, s0)) + 1}px;height:${Math.max(20, y(Math.min(END, e0)) - y(Math.max(8, s0)) - 2)}px"><b>${esc(x.name)}</b>${fmtH(s0)} – ${fmtH(e0)} · Your plan${over ? " · past bedtime" : ""}</button>`; }).join("");

        if (gapSel === k && ideaSel != null && ideaById(ideaSel)){
          const it = ideaById(ideaSel), e0 = g[0] + durOf(it), over = e0 > B;
          tl += `<div class="ev ghost${over ? " over" : ""}" style="top:${y(g[0]) + 1}px;height:${y(Math.min(END, e0)) - y(g[0]) - 2}px"><b>${esc(it.name)}</b>${fmtH(g[0])} – ${fmtH(e0)} · preview</div>`;
        } else tl += `<button type="button" class="ev gap" data-gap="${k}" aria-pressed="${gapSel === k}" style="top:${y(g[0]) + 3}px;height:${y(g[1]) - y(g[0]) - 6}px"><span><b>Open</b> · ${fmtH(g[0])} – ${fmtH(g[1])}</span><span class="plus">${PLUS}</span></button>`;
      });
      if (cur === iso(today())){ const n = new Date(), nh = n.getHours() + n.getMinutes() / 60; if (nh >= 8 && nh <= END) tl += `<div class="now" style="top:${y(nh)}px"></div>`; }
      let hd = `<div class="headrow dnav"><button type="button" class="navb" data-dstep="-1" aria-label="Previous day">${CHL}</button><span class="t"><b>${esc(fmtD(cur))}</b><span>${cur === iso(today()) ? "Today · " : ""}${cnt} on the schedule</span></span><button type="button" class="navb" data-dstep="1" aria-label="Next day">${CHR}</button><button type="button" class="iconbtn" data-close aria-label="Close" style="width:38px;height:38px">${IC.close}</button></div>
        <div class="sumrow"><span class="rate ${rk[0]}"><span class="bz ${rk[0]}"></span>${rk[1]}</span><small>${Math.round(hrs * 10) / 10} hr booked${planned ? " + " + planned + " hr planned" : ""} · ${gaps.length} open</small></div>
        <div class="meter"><i style="width:${Math.min(100, tot / (B - 8) * 100)}%;background:${rk[0] === "p" ? "var(--red)" : rk[0] === "m" ? "#F0A35E" : "#7FD6A6"}"></i></div>`;
      if (note) hd += `<div class="calnote">${note}</div>`;
      if (calAll.length || untimed.length || done.length) hd += `<div class="alldays">${calAll.map((e) => `<span>All day · ${esc(e.title)}</span>`).join("")}${untimed.map((x) => `<span class="mine">${esc(x.name)} · no time yet</span>`).join("")}${done.map((l) => `<span class="mine">✓ ${esc(l.name)}</span>`).join("")}</div>`;

        let warn = "";
        if (it && e0 > B) warn = bedMsg(e0);
        else if (it && next && e0 > next[0] + 1e-6) warn = `<p class="bedwarn">${IC.alert}<span>Runs into something else at ${fmtH(next[0])}.</span></p>`;
        hd += `<div class="dtray" id="dtray"><div class="tgrab" aria-hidden="true"></div><div class="tt"><b>Plan into ${fmtH(g[0])} – ${fmtH(g[1])}</b><span>${Math.round((g[1] - g[0]) * 10) / 10} hr free</span></div>
          ${list.length ? `<label class="dsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="dv-q" type="search" placeholder="Search your ${list.length} tasks" value="${esc(q)}" autocomplete="off" enterkeyhint="done" aria-label="Search your tasks"></label>
          <div class="ideas" id="dv-ideas">${CATS.map((c) => { const L = list.filter((x) => (x.cat || "other") === c.id || (!CATS.some((k) => k.id === x.cat) && c.id === "other")); return L.length ? `<div class="igh" data-gh="${c.id}"><span>${CI[c.id]} ${esc(c.name)}</span><span>${L.length}</span></div>` + L.map((x) => `<button type="button" class="idea" data-idea="${esc(x.id)}" data-c="${c.id}" data-n="${esc(x.name.toLowerCase())}" aria-pressed="${ideaSel === x.id}">${cic(x.cat)}<span><b>${esc(x.name)}</b><small>${x.date ? "On " + esc(fmtDay(x.date)) + (x.time ? " · " + esc(fmtTime(x.time)) : "") : "Idea"} · about ${durLabel(durOf(x))}</small></span>${x.date ? `<span class="itag">${x.date === cur ? "Set time" : DOW[dowIdx(parse(x.date))] + " · move"}</span>` : ""}</button>`).join("") : ""; }).join("")}<p class="inone" id="dv-none" hidden>No tasks match.</p></div>` : `<p class="hint" style="margin:0">No tasks yet. Add one with the + button.</p>`}
          ${warn}
          <button type="button" class="save" id="dv-add" ${it ? "" : "disabled"}>${!it ? "Pick an idea" : warn ? "Add anyway" : (it.date ? "Move to " : "Add to ") + DOW[dowIdx(parse(cur))] + " at " + fmtH(g[0])}</button></div>`;
      } else hd += `<div style="height:8px"></div>`;
      box.innerHTML = hd;
      const tray = box.querySelector("#dtray");
      if (tray){ wireTray(tray); filterIdeas(); }
    }
    // Every open task, except ones already timed on this day (those are on the timeline). Ideas first, then planned ones.
    const ideasList = () => openActs().filter((x) => !(x.date === cur && x.time)).sort((a, b) => (a.date ? 1 : 0) - (b.date ? 1 : 0) || (a.date ? (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")) : waitingSort(a, b)));
    const ideaById = (id) => ideasList().find((x) => x.id === id) || null;
    function filterIdeas(){
      const wrap = box.querySelector("#dv-ideas"); if (!wrap) return;
      const t = q.trim().toLowerCase(), seen = {};
      let any = false;
      wrap.querySelectorAll(".idea").forEach((b) => { const ok = !t || b.dataset.n.includes(t); b.hidden = !ok; if (ok){ seen[b.dataset.c] = (seen[b.dataset.c] || 0) + 1; any = true; } });
      wrap.querySelectorAll(".igh").forEach((h) => { const n = seen[h.dataset.gh] || 0; h.hidden = !n; h.lastElementChild.textContent = n; });
      const none = box.querySelector("#dv-none"); if (none) none.hidden = any;

    box.addEventListener("input", (e) => { if (e.target.id === "dv-q"){ q = e.target.value; filterIdeas(); } });
    function wireTray(tray){
      let y0 = null, cur2 = 0, v = 0, ly = 0, lt = 0;
      tray.addEventListener("pointerdown", (e) => { if (e.target.closest("button,input,label,.ideas")) return; y0 = e.clientY; ly = y0; lt = performance.now(); cur2 = 0; v = 0; try { tray.setPointerCapture(e.pointerId); } catch (er){} });
      tray.addEventListener("pointermove", (e) => { if (y0 == null) return; const d = e.clientY - y0, n = performance.now(); v = (e.clientY - ly) / Math.max(1, n - lt); ly = e.clientY; lt = n; cur2 = Math.max(-10, d); tray.style.transform = `translateY(${cur2}px)`; });
      const end = () => { if (y0 == null) return; y0 = null; tray.style.transform = ""; if (cur2 > 70 || v > .5){ gapSel = null; ideaSel = null; draw(); } };
      tray.addEventListener("pointerup", end); tray.addEventListener("pointercancel", end);
    }
    dayRedraw = draw;
    box.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.dstep){ cur = iso(addDays(parse(cur), Number(b.dataset.dstep))); gapSel = null; ideaSel = null; q = ""; draw(); sfx("tab"); return; }
      const into = (el) => { if (!el) return; const sr = sh.getBoundingClientRect(), r = el.getBoundingClientRect(); sh.scrollTo({top: sh.scrollTop + r.top - sr.top - 150, behavior: RM ? "auto" : "smooth"}); };
      if (b.dataset.gap != null && b.classList.contains("gap")){ const k = Number(b.dataset.gap); gapSel = gapSel === k ? null : k; ideaSel = null; q = ""; const keep = sh.scrollTop; draw(); sh.scrollTop = keep; if (gapSel != null) into(box.querySelector(".ev.gap[aria-pressed=true]")); return; }
      if (b.dataset.idea != null){ ideaSel = b.dataset.idea; const keep = sh.scrollTop, lst = box.querySelector("#dv-ideas"), ls = lst ? lst.scrollTop : 0; draw(); sh.scrollTop = keep; const l2 = box.querySelector("#dv-ideas"); if (l2) l2.scrollTop = ls; into(box.querySelector(".ev.ghost")); return; }
      if (b.dataset.edit){ openDetails(b.dataset.edit); return; }
      if (b.id === "dv-add"){
        const g = gapsOn(cur, (S.cal[cur] || []).filter((x) => !x.allDay).map((x) => [x.s, x.e]).concat(plansOn(cur).filter((x) => x.time).map((x) => [hourOf(x.time), hourOf(x.time) + durOf(x)])))[gapSel];
        const x = ideaById(ideaSel); if (!g || !x) return;

        draw();
      }
    });
    draw();
  }

  function openLog(logId){

    const sh = openSheet(`${sheetHead("Logged")}

  // ---------- Sunday planning ----------
  function openSunday(){
    const si = sunInfo(); if (!si) return;
    const P = {step:1, picks:[], days:{}};
    const ideas = openActs().filter((x) => !x.date).sort(waitingSort);
    const tIso = iso(today());
    const days = Array.from({length:7}, (_, i) => addDays(si.ws, i));
    const ago = (s) => { const n = Math.round((today() - parse(s)) / 864e5); return n <= 0 ? "today" : n === 1 ? "yesterday" : n < 14 ? n + " days ago" : Math.round(n / 7) + " weeks ago"; };
    function suggest(){
      const used = new Set();
      P.picks.forEach((id) => {
        if (P.days[id] != null){ used.add(P.days[id]); return; }
        const x = S.acts.find((a) => a.id === id);
        const order = x && x.cat === "outdoors" ? [5, 6, 4, 2, 3, 1, 0] : [2, 3, 1, 4, 5, 6, 0];
        const k = order.find((i) => !used.has(i) && iso(days[i]) >= tIso);
        P.days[id] = k == null ? 6 : k; used.add(P.days[id]);
      });
    }
    const sh = openSheet(`<div id="sun-body" style="display:flex;flex-direction:column;gap:14px"></div>`, "Plan the week");
    const body = sh.querySelector("#sun-body");
    function draw(){
      let h = "";
      if (P.step === 1){
        h += `<div class="shh"><h2>Pick ${si.need} for ${si.mon ? "this" : "next"} week</h2><span>${P.picks.length} of ${si.need}</span></div>`;
        if (!ideas.length) h += `<p class="hint" style="margin:0;font-size:13px">Your ideas list is empty. Add something you've been putting off first.</p>`;
        h += ideas.map((x) => { const on = P.picks.includes(x.id); return `<button type="button" class="prow" data-pick="${esc(x.id)}" aria-pressed="${on}" ${!on && P.picks.length >= si.need ? "disabled" : ""}>${cic(x.cat)}<span class="ptx"><b>${esc(x.name)}</b><span>${x.lastDone ? "Last done " + ago(x.lastDone) : "Added " + ago(iso(new Date(x.created || Date.now())))}</span></span><span class="pc">${IC.check}</span></button>`; }).join("");
        h += `<div class="btnrow">${ideas.length ? `<button type="button" data-s="auto">Pick for me</button>` : ""}<button type="button" data-s="new">Add new idea</button></div>`;

      return;
    }
    if (t.dataset.move){ openMove(t.dataset.move); return; }
    if (t.dataset.dayview){ openDay(t.dataset.dayview); return; }
    if (t.dataset.hfilter){ S.hfilter = t.dataset.hfilter; render(); return; }
    if (t.dataset.hview){ S.hview = t.dataset.hview; render(); return; }
    if (t.dataset.wkreplay){ playConstellation(parse(t.dataset.wkreplay)); return; }
    if (t.hasAttribute("data-skyquest")){ openQuests(); return; }
    if (t.hasAttribute("data-skylabels")){ skyLabels = !skyLabels; render(); return; }
    if (t.hasAttribute("data-skybare")){ skyBare = !skyBare; render(); if (skyBare) toast("Tap the sky to bring the buttons back."); return; }
    if (t.dataset.hputback){ const l = S.log.find((x) => x.id === t.dataset.hputback); if (l) restoreLog(l); return; }
    if (t.dataset.hrestore){
      const h = S.hist.find((x) => x.id === t.dataset.hrestore);
      if (h && h.snap && !S.acts.some((a) => a.id === h.actId)){ const a = Object.assign({}, h.snap, {id: h.actId}); rec("restored", a); sfx("undo"); saveWithCal(a, "Restored " + a.name + "."); }
      return;
    }
    if (t.dataset.star){ starTip(t); return; }
    if (t.hasAttribute("data-stipx")){ const tp = document.getElementById("stip"); if (tp) tp.hidden = true; document.querySelectorAll(".istar.sel").forEach((e) => e.classList.remove("sel")); return; }
    if (t.dataset.edit){ if (holdFired){ holdFired = false; return; } openDetails(t.dataset.edit); }
    else if (t.dataset.done) completeAct(t.dataset.done);
    else if (t.dataset.log) openLog(t.dataset.log);
    else if (t.dataset.day) openPicker(t.dataset.day);
    else if (t.dataset.resched){
      const x = S.acts.find((a) => a.id === t.dataset.resched);
      if (x){ const nx = Object.assign({}, x, {date: iso(addDays(today(), 1))}); rec("moved", nx, {from: absDay(x), to: absDay(nx)}); sfx("move"); saveWithCal(nx, "Moved to tomorrow. Don't skip this one."); }
    }
    else if (t.hasAttribute("data-sunday")) openSunday();
    else if (t.hasAttribute("data-savefile")) saveBackup();
    else if (t.hasAttribute("data-loadsave")) pickSaveFile();
    else if (t.dataset.qpick !== undefined){ const o = questOptions(weekStart(today()))[Number(t.dataset.qpick)]; if (o){ qState().pick = Object.assign({wk: iso(weekStart(today()))}, o); sfx("add"); putSettings(); toast("Quest set: " + o.n + "."); } }
    else if (t.hasAttribute("data-qchange")){ qState().pick = null; putSettings(); }
    else if (t.dataset.sunx){ store.set("twa_sun", t.dataset.sunx); render(); toast("Hidden until next weekend."); }
    else if (t.hasAttribute("data-pick")) openPicker();
    else if (t.hasAttribute("data-add")) openEdit(null);
    else if (t.hasAttribute("data-settings")) openSettings();
    else if (t.hasAttribute("data-greconnect")){
      gConnect().then(() => { S.settings.calDefault = true; putSettings(); calLoaded = {}; render(); loadCal(weekStart(today())); loadCal(addDays(weekStart(today()), 7)); toast("Calendar connected."); })
        .catch((err) => toast(err && err.code === "popup_closed" ? "Sign-in was closed." : "Couldn't connect. Try again in Settings > Calendar.", null, 3500));
    }
    else if (t.dataset.filter){ S.filter = t.dataset.filter; render(); }
  });

  let toastTimer;
  function toast(msg, actions, ms){
    let el = document.querySelector(".toast");
    if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.innerHTML = `<span class="tm"></span>`;
    el.querySelector(".tm").textContent = msg;
    (actions || []).forEach((a) => { const b = document.createElement("button"); b.type = "button"; b.textContent = a.label; b.addEventListener("click", () => { el.hidden = true; a.fn(); }); el.appendChild(b); });
    el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms || 2600);
  }

  // ---------- opening: horizon + wordmark (full once a day, ring sweep after that) ----------
  function playSplash(){
    const sp = document.createElement("div");
    sp.className = "splash"; sp.setAttribute("aria-hidden", "true");
    sp.innerHTML = `<div class="sbg"></div><div class="dawn"></div><div class="sky"><div class="sun"></div></div><div class="hz"></div><div class="wm"><div class="w1">${["S","≠","L"].map((c) => `<span class="lt">${c}</span>`).join("")}<span class="aw"></span></div><div class="tag">Surviving isn't living.</div></div>`;
    document.body.appendChild(sp);
    let skipRes; const skipP = new Promise((r) => { skipRes = r; });
    sp.addEventListener("click", () => { if (!sp._snd){ sp._snd = 1; setTimeout(() => sfx("open"), 30); } skipRes(); });
    setTimeout(() => { if (!sp._snd && actx && actx.state === "running"){ sp._snd = 1; sfx("open"); } }, 60);
    const $s = (q) => sp.querySelector(q);
    const sun = $s(".sun"), hz = $s(".hz"), dawn = $s(".dawn"), sky = $s(".sky"), wm = $s(".wm");
    hz.animate([{transform:"scaleX(0)"},{transform:"scaleX(1)"}], {duration:672, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
    dawn.animate([{opacity:0},{opacity:1}], {duration:1120, delay:320, fill:"forwards"});
    sun.animate([{transform:"translateY(0)"},{transform:"translateY(-100px)"}], {duration:1024, delay:416, easing:"cubic-bezier(.2,.7,.2,1)", fill:"forwards"});
    sp.querySelectorAll(".lt").forEach((l, i) => l.animate([{opacity:0, transform:"translateY(6px)"},{opacity:1, transform:"none"}], {duration:352, delay:896 + i * 112, fill:"forwards"}));
    $s(".aw").animate([{opacity:0},{opacity:1}], {duration:416, delay:1472, fill:"forwards"});
    $s(".tag").animate([{opacity:0, transform:"translateY(6px)"},{opacity:1, transform:"none"}], {duration:480, delay:1696, fill:"forwards"});
    return (async () => {
      await Promise.race([new Promise((r) => setTimeout(r, 2528)), skipP]);
      await Promise.race([S.readyP, new Promise((r) => setTimeout(r, 900))]);
      sky.style.overflow = "visible";
      const rg = document.querySelector("#app .hero .ring");
      if (rg){
        const a = ctr(sun), b = ctr(rg);
        sun.getAnimations().forEach((an) => an.commitStyles && an.commitStyles());
        sun.getAnimations().forEach((an) => an.cancel());
        sun.animate([{transform:"translateY(-100px)", opacity:1},{transform:`translate(${b.x - a.x}px,${b.y - a.y - 100}px) scale(.9)`, opacity:0}], {duration:608, easing:"cubic-bezier(.5,0,.25,1)", fill:"forwards"});
      } else sun.animate([{opacity:1},{opacity:0}], {duration:416, fill:"forwards"});
      wm.animate([{opacity:1, transform:"none"},{opacity:0, transform:"translateY(-14px)"}], {duration:416, fill:"forwards"});
      hz.animate([{opacity:1},{opacity:0}], {duration:352, fill:"forwards"});
      dawn.getAnimations().forEach((an) => an.finish());
      dawn.animate([{opacity:1},{opacity:0}], {duration:480, fill:"forwards"});
      $s(".sbg").animate([{opacity:1},{opacity:0}], {duration:512, delay:128, fill:"forwards"});
      setTimeout(() => sp.remove(), 736);
    })();
  }
  async function reveal(full){
    const app = document.getElementById("app");
    if (RM) return;
    if (full) [...app.children].forEach((k, i) => k.animate([{opacity:0, transform:"translateY(12px)"},{opacity:1, transform:"none"}], {duration:340, delay:Math.min(i, 8) * 50 + 60, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards"}));
    const rg = app.querySelector(".hero .ring");
    if (rg){
      const w = weekInfo(), g = S.settings.goal, n = w.done.length;
      setRingNow(rg, 0, false);
      await new Promise((r) => setTimeout(r, full ? 240 : 80));
      setRing(rg, Math.min(1, n / g), n >= g);
    }
    const al = app.querySelector(".alert[role=alert]");
    if (al){
      await new Promise((r) => setTimeout(r, full ? 420 : 300));
      sfx("alert");
      await al.animate([{opacity:0, transform:"translateY(-16px)"},{opacity:1, transform:"none"}], {duration:300, easing:"cubic-bezier(.2,.9,.3,1.2)", fill:"backwards"}).finished;
      al.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(-3px)"},{transform:"translateX(0)"}], {duration:320});
    }
  }
  async function intro(){
    let full = !RM && store.get("twa_intro") !== iso(today());
    if (full){
      store.set("twa_intro", iso(today()));
      const exit = playSplash();
      await new Promise((r) => setTimeout(r, 40));
      await exit;
      reveal(true);
    } else {
      await Promise.race([S.readyP, new Promise((r) => setTimeout(r, 1500))]);
      reveal(false);
    }
  }

  // re-check the calendar when you come back to the app
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || S.status !== "live") return;
    calLoaded = {}; loadCal(weekStart(today())); loadCal(addDays(weekStart(today()), 7)); loadCal(addDays(weekStart(today()), 14));
  });

  // ---------- boot ----------
  render();
  requestAnimationFrame(() => placeInd(true));
  intro();
  (async () => {
    let db = null;
    if (STANDALONE) db = localDb();
    else try { db = await window.claude.use("db"); } catch (e){ db = null; }
    if (!db){ S.status = "offline"; render(); readyRes(); return; }
    S.db = db;
    const ready = () => {
      if (S.got.acts && S.got.log && S.status === "loading"){
        S.status = "live"; readyRes();
        setTimeout(() => { loadCal(weekStart(today())); loadCal(addDays(weekStart(today()), 7)); loadCal(addDays(weekStart(today()), 14)); if (STANDALONE && GAS() && store.get("twa_cloudok") !== "1") cloudSync().then((r) => { if (r === "restored") toast("Your data was restored from the cloud."); }).catch(() => {}); }, 300);
        const last = snaps()[0];
        if ((S.acts.length || S.log.length) && (!last || iso(new Date(last.at)) !== iso(today()))) setTimeout(() => takeSnap("Daily"), 1500);
        setTimeout(() => { autoSig = dataSig(); }, 1600); // starting point for auto-save
      }
    };
    let pruned = false;
    db.collection("hist").onSnapshot((snap) => {
      S.hist = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      if (!pruned){ pruned = true; const cut = Date.now() - 90 * 864e5; S.hist.filter((h) => h.ts < cut).slice(0, 30).forEach((h) => db.doc("hist/" + h.id).delete().catch(() => {})); }
      if (S.tab === "hist"){ if (!sheetEl) render(); else S.pending = true; }
    }, () => {});
    db.collection("acts").onSnapshot((snap) => {
      S.acts = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      S.got.acts = true; ready(); if (!sheetEl) render(); else S.pending = true;
    }, () => { S.status = "offline"; render(); readyRes(); });
    db.collection("log").onSnapshot((snap) => {
      S.log = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      S.got.log = true; ready(); if (!sheetEl) render(); else S.pending = true;
    }, () => { S.got.log = true; ready(); render(); });
    db.doc("config/settings").onSnapshot((snap) => {
      if (snap.exists){
        const v = snap.data() || {}, g = Number(v.goal), nd = Number(v.nudge);
        if (g >= 1 && g <= 7) S.settings.goal = g;
        if (nd >= 2 && nd <= 7) S.settings.nudge = nd;
        if (typeof v.calDefault === "boolean") S.settings.calDefault = v.calDefault;
        if (typeof v.bed === "string" && /^\d{2}:\d{2}$/.test(v.bed)) S.settings.bed = v.bed;
        if (typeof v.sound === "boolean") S.settings.sound = v.sound;
        if (v.q && typeof v.q === "object") S.settings.q = v.q;
        // One-time switch from the old 2-a-week default to 3 (later changes in Settings stick).
        if (v.goalMig !== 1){ if (S.settings.goal === 2) S.settings.goal = 3; S.settings.goalMig = 1; setTimeout(() => putSettings(), 0); }
        else S.settings.goalMig = 1;
      }
      if (!sheetEl) render(); else S.pending = true;
    }, () => {});
  })();
})();
</script>
