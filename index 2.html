<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twice a Week">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Twice a Week</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
/* Soft Night, same family as Mission Budget: one phone-width column of rounded cards on charcoal, peach-to-rose gradients, floating pill nav. Single dark theme by design. */
:root{
  --bg:#050506; --card:#141416; --card2:#1C1C20; --track:#222226; --line:#34343A; --fg:#F5F5F5; --muted:#8E8E95; --faint:#6E6E75;
  --a1:#6A4BFF; --a2:#C08BFF;
  --accent:#B79BFF; --accent-ink:#FFFFFF; --accent-tint:rgba(106,75,255,.18); --ok-ink:#050506;
  --ok:#E9E1FF; --ok-tint:rgba(255,255,255,.1); --warn:#F08A80; --warn-tint:rgba(240,138,128,.14); --red:#F08A80; --red-tint:rgba(240,138,128,.14);
  --scrim:rgba(4,4,6,.66); --nav:#18181B; --nav2:#0E0E10; --shadow:rgba(0,0,0,.5); --edge:rgba(255,255,255,.08);
  --surface:linear-gradient(160deg,#18181B 0%,#111113 100%);
  --g-warm:linear-gradient(135deg,#6A4BFF 0%,#C08BFF 100%);
  --g-text:linear-gradient(135deg,#C08BFF 0%,#8A6BFF 100%);
  --g-ok:linear-gradient(135deg,#FFFFFF 0%,#C08BFF 100%);
  --g-hero:radial-gradient(130% 150% at 0% 0%,rgba(106,75,255,.30) 0%,rgba(106,75,255,.08) 45%,rgba(20,20,22,0) 75%),linear-gradient(160deg,#18181B,#0F0F11);
  --g-notice:linear-gradient(135deg,rgba(106,75,255,.20) 0%,rgba(255,255,255,.03) 80%);
  --g-alert:linear-gradient(135deg,rgba(240,96,84,.24) 0%,rgba(255,255,255,.03) 75%);
  --g-glow:radial-gradient(560px 380px at 0% -110px,rgba(106,75,255,.26),rgba(5,5,6,0) 70%),radial-gradient(480px 340px at 100% -60px,rgba(255,255,255,.07),rgba(5,5,6,0) 70%);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--g-glow),var(--bg);background-repeat:no-repeat;color:var(--fg);font-family:var(--font);font-size:15px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:24px 180px;display:flex;flex-direction:column;gap:16px}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head{display:flex;flex-direction:column;gap:2px;min-width:0}
.head .date{font-size:14px;color:var(--muted)}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:12px}
.sechead > span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:24px;padding:20px}
.hero{display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.card.hero{background:var(--g-hero);border:1px solid var(--edge)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 50%,rgba(192,139,255,.42),rgba(192,139,255,0) 62%);opacity:0;pointer-events:none}
.hero.glow::after{animation:glow 1.2s ease-out}
@keyframes glow{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.hero .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--accent);background:var(--g-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;align-self:flex-start}
.big small{font-size:20px;font-weight:700;-webkit-text-fill-color:var(--muted)}
.big.hit{color:var(--ok);background-image:var(--g-ok)}
.sub{font-size:13px;color:var(--muted);line-height:1.45;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ring{flex:none;overflow:visible}
.ring .arc{transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1),opacity .5s}
.badge{width:20px;height:20px;border-radius:10px;background:var(--g-ok);display:inline-grid;place-items:center;color:var(--ok-ink);flex:none}
.badge svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.lastone{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--fg)}
.lastone.warn{background:var(--warn-tint);color:var(--warn)} .lastone.bad{background:var(--red-tint);color:var(--red)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn svg{width:18px;height:18px}
.alert{background:var(--g-alert);border:1px solid rgba(240,96,84,.45);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.ahead{background:none;border:0;width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:center;gap:2px 10px;padding:13px 14px 13px 16px;min-height:56px}
.ahead .aline{grid-column:1;font-size:14px;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahead .achev{grid-column:2;grid-row:1 / span 2;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--fg);transition:transform .2s}
.ahead .achev svg,.planbtn svg{width:16px;height:16px}
.ahead[aria-expanded="true"] .achev{transform:rotate(180deg)}
.abody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.alert .at{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.alert .at svg{width:16px;height:16px}
.alert p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap}
.alert.soon{background:var(--g-notice);border-color:rgba(106,75,255,.35)}
.alert.soon .at{color:var(--accent)}
.must{color:var(--accent);font-weight:700}
.notice{background:var(--g-notice);border:1px solid rgba(106,75,255,.3);color:var(--accent);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;line-height:1.4}
.notice.soft{background:var(--card);border-color:var(--edge);color:var(--fg)}
.notice b{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.notice .nbtns{display:flex;gap:6px;align-items:center;flex:none}
.notice .x{width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--muted)}
.notice .x svg{width:14px;height:14px}
.pillbtn{background:var(--g-warm);color:var(--accent-ink);box-shadow:0 4px 14px rgba(106,75,255,.3);border:0;border-radius:999px;font-weight:700;font-size:13px;padding:8px 14px;min-height:36px;white-space:nowrap}
.pillbtn.ghost{background:var(--card2);color:var(--fg)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--card);border:1px solid transparent;border-radius:16px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.day .dl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.day .dn{font-size:17px;font-weight:700}
.day .dots{display:flex;gap:3px;height:8px;align-items:center}
.day .dots i{width:7px;height:7px;border-radius:4px;background:var(--fg)}
.day .dots i.o{background:none;border:1.5px solid var(--fg)}
.day.today{background:linear-gradient(180deg,#1E1C26,var(--card)) padding-box,var(--g-warm) border-box;border:1.5px solid transparent}
.day.today .dl{color:var(--accent)}
.day.past{opacity:.5}
button.day:active{background:var(--card2)}

/* rows */
.list{display:flex;flex-direction:column;gap:10px}
.arow{background:var(--surface);border:1px solid var(--edge);border-radius:18px;display:flex;align-items:stretch;gap:2px;padding-left:10px;overflow:hidden;transition:box-shadow .3s}
.arow.glow{box-shadow:0 0 0 1.5px var(--a2),0 0 26px -6px var(--a1)}
.amain{flex:1;min-width:0;background:none;border:0;text-align:left;display:grid;grid-template-columns:16px minmax(0,1fr);gap:12px;align-items:start;padding:14px 12px 14px 8px;border-radius:18px}
.amain:active{background:var(--card2)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--gc,var(--muted));flex:none;margin-top:5px}
.cic{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted);display:grid;place-items:center}
.cic svg,.chip svg.ic,.prow .cic svg{width:16px;height:16px}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.atxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.t1{font-size:15px;font-weight:600;overflow-wrap:anywhere;position:relative;align-self:flex-start;transition:color .3s}
.t1::after{content:"";position:absolute;left:-2px;right:-2px;top:54%;height:2px;border-radius:1px;background:var(--g-warm);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.struck .t1{color:var(--muted)}
.struck .t1::after{transform:scaleX(1)}
.t2{font-size:12px;color:var(--muted)}
.t2.late{color:var(--warn)}
.t3{font-size:13px;color:var(--muted);line-height:1.45;white-space:pre-line}
.t3.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.plan{margin-top:6px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;color:var(--fg);line-height:1.5;white-space:pre-line}
.plan b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
.tag svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.tag.must{background:var(--accent-tint);color:var(--accent)}
.tag.late{background:var(--warn-tint);color:var(--warn)}
.tag.cal{background:var(--ok-tint);color:var(--ok)}
.aside{display:flex;flex-direction:column;gap:6px;padding:12px 10px 12px 0;flex:none}
.movebtn svg{width:16px;height:16px}
.planbtn{width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s}
.planbtn[aria-expanded="true"]{transform:rotate(180deg);color:var(--fg)}
details.hw{background:var(--card2);border-radius:14px;padding:0 14px}
details.hw summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-weight:700;font-size:14px;color:var(--fg)}
details.hw summary::-webkit-details-marker{display:none}
details.hw summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.hw[open] summary::after{transform:rotate(-135deg)}
details.hw p{margin:0 0 14px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.oncal{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font-weight:700}
.oncal svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.donebtn{position:relative;align-self:center;width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:var(--muted);flex:none;padding:0;transition:transform .12s,border-color .2s}
.donebtn::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--g-warm);transform:scale(0);transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.donebtn.mint::before{background:var(--g-ok)}
.donebtn.mint.on{color:var(--ok-ink)}
.donebtn svg{width:18px;height:18px;position:relative;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.donebtn:hover{border-color:var(--a2);color:var(--a2)}
.donebtn.press{transform:scale(.86)}
.donebtn.on{border-color:transparent;color:var(--accent-ink)}
.donebtn.on::before{transform:scale(1)}
.donebtn.on path{animation:draw .3s .12s both}
@keyframes draw{from{stroke-dasharray:24;stroke-dashoffset:24}to{stroke-dasharray:24;stroke-dashoffset:0}}
.flydot{position:fixed;width:14px;height:14px;border-radius:7px;background:var(--g-warm);box-shadow:0 0 16px rgba(140,100,255,.8);pointer-events:none;z-index:40}
.flydot.mint{background:var(--g-ok);box-shadow:0 0 16px rgba(220,200,255,.8)}
.empty{color:var(--muted);font-size:14px;padding:4px 2px;line-height:1.5}
.gtitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:6px 2px 0}
.logcard{background:var(--surface);border:1px solid var(--edge);border-radius:18px;padding:2px 16px}
.logrow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;width:100%;background:none;border:0;text-align:left}
.logrow + .logrow{border-top:1px solid var(--track)}
.logrow .chev{color:var(--faint);align-self:center}
.logrow .chev svg{width:15px;height:15px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid transparent;background:var(--card2);border-radius:999px;min-height:38px;padding:7px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip.dotted::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--gc)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--g-notice);color:var(--accent)}
.chip:disabled{opacity:.35}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters .chip{flex:none;background:var(--card)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--edge);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:10;pointer-events:none}
.nav .in{pointer-events:auto;max-width:452px;margin:0 auto;height:66px;background:linear-gradient(180deg,var(--nav),var(--nav2));border:1px solid var(--edge);border-radius:33px;box-shadow:0 10px 30px var(--shadow);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:0 6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;min-height:52px;border-radius:24px;padding:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(50% - 222px),env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:11;width:58px;height:58px;border-radius:29px;border:0;background:var(--g-warm);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px var(--shadow),0 6px 20px rgba(106,75,255,.4)}
.fab svg{width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:480px;max-height:92%;overflow:auto;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet .grab{width:40px;height:5px;background:var(--track);border-radius:3px;align-self:center}
.sheet .iconbtn{background:var(--card2)}
.sheet .chip{background:var(--card2)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;display:block}
.field{background:var(--card2);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-height:44px;width:100%;color:var(--fg)}
.field:focus{border-color:var(--accent);outline:none}
.field::placeholder{color:var(--faint)}
textarea.field{min-height:92px;resize:vertical;line-height:1.45}
.namefield{background:none;border:0;font-size:24px;font-weight:700;width:100%;color:var(--fg);padding:0;caret-color:var(--accent)}
.namefield:focus{outline:none}
.namefield::placeholder{color:var(--line)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px}
.typetog{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:999px;padding:4px}
.typetog button{background:none;border:0;border-radius:999px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.typetog button[aria-pressed="true"]{background:var(--g-warm);color:var(--accent-ink)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.save{background:var(--g-warm);color:var(--accent-ink);border:0;border-radius:999px;min-height:52px;font-size:16px;font-weight:700;width:100%}
.save.ghost{background:var(--card2);color:var(--fg)}
.save:disabled{opacity:.4}
.btnrow{display:flex;gap:8px}
.btnrow > button{flex:1;min-height:46px;border-radius:999px;border:0;font-weight:700;font-size:14px;background:var(--card2);color:var(--fg)}
.btnrow > button.ok{background:var(--ok-tint);color:var(--ok)}
.btnrow > button.danger.armed{background:var(--red-tint);color:var(--red)}
.btnrow > .save{flex:1}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:22px;border:0;background:var(--card2);font-size:22px;font-weight:700}
.stepper .n{font-size:32px;font-weight:800;min-width:40px;text-align:center;color:var(--accent);background:var(--g-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.setblock{display:flex;flex-direction:column;gap:10px}
.setblock + .setblock{border-top:1px solid var(--track);padding-top:16px}
.how{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;color:var(--muted)}
.how b{color:var(--fg)}
.togrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px 14px}
.togrow b{font-size:14px;font-weight:700;display:block}
.togrow span{font-size:12px;color:var(--muted)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;border:0;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--fg);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--g-ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* sunday planner */
.shh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shh span{font-size:13px;color:var(--muted)}
.prow{width:100%;border:1.5px solid transparent;background:var(--card2);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:16px minmax(0,1fr) 24px;gap:12px;align-items:center;text-align:left}
.prow > i{width:10px;height:10px;border-radius:5px;background:var(--gc)}

.dblock{display:flex;flex-direction:column;gap:8px}
.dblock .nm{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.dblock .nm i{width:10px;height:10px;border-radius:5px;background:var(--gc)}
.dchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dc{min-height:48px;border-radius:12px;border:0;background:var(--card2);font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}

.setcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}

/* opening: horizon + wordmark */
.splash{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer}
.splash .sbg{position:absolute;inset:0;background:var(--g-glow),var(--bg);background-repeat:no-repeat}
.splash .dawn{position:absolute;inset:0;background:radial-gradient(75% 42% at 50% 56%,rgba(106,75,255,.36),rgba(106,75,255,.08) 50%,rgba(5,5,6,0) 76%);opacity:0}
.splash .sky{position:absolute;left:0;right:0;top:0;height:56%;overflow:hidden}

.splash .hz{position:absolute;left:max(12%,calc(50% - 180px));right:max(12%,calc(50% - 180px));top:56%;height:2px;border-radius:1px;background:linear-gradient(90deg,rgba(106,75,255,0),#C08BFF,rgba(106,75,255,0));box-shadow:0 0 16px rgba(140,100,255,.7);transform:scaleX(0)}
.splash .wm{position:absolute;left:0;right:0;top:calc(56% + 22px);display:flex;flex-direction:column;align-items:center;gap:8px}
.splash .w1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.splash .lt{display:inline-block;background:linear-gradient(135deg,#C08BFF 0%,#8A6BFF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0}

.splash .tag{font-size:14px;color:var(--muted);opacity:0}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

<script>
(function(){
  "use strict";
  const CATS = [
    {id:"movie", name:"Movie", c:"var(--c-movie)"},
    {id:"outdoors", name:"Outdoors", c:"var(--c-outdoors)"},
    {id:"food", name:"Food & drink", c:"var(--c-food)"},
    {id:"creative", name:"Creative", c:"var(--c-creative)"},
    {id:"social", name:"Social", c:"var(--c-social)"},
    {id:"other", name:"Other", c:"var(--c-other)"}
  ];
  const catOf = (id) => CATS.find((c) => c.id === id) || CATS[5];
  const CI = {
    movie:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7.5 6l2 4M13 6l2 4"/></svg>',
    outdoors:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19l6.5-10 4 6 2.5-3.5L21 19z"/><circle cx="17" cy="6" r="1.8"/></svg>',
    food:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2.2 1.2-3 3.6-3 6.5V13h3"/></svg>',
    creative:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>',
    social:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16 14.6c2.3 0 4 1.4 4.5 4"/></svg>',
    other:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l1.8 5.2L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.8z"/></svg>'
  };
  const cic = (id) => `<span class="cic">${CI[catOf(id).id]}</span>`;
  const IC = {
    check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    cal:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/></svg>',
    calok:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/><path d="M9 14.5l2 2 4-4"/></svg>',
    move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2.5"/><path d="M3 9.5h13M7 3v4M12 3v4"/><path d="M14 15h7M18.5 12.5L21 15l-2.5 2.5"/></svg>',
    chevd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></svg>'
  };
  const badge = () => `<span class="badge">${IC.check}</span>`;
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Standalone build: no Claude here, so data is saved on this device and calendar sync is hidden until Google sign-in is added.
  const STANDALONE = !(window.claude && window.claude.use);
  function localDb(){
    const KEY = "twa_data_v1";
    let data; try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e){ data = null; }
    data = data || {acts:{}, log:{}, config:{}};
    const subs = {};
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e){} };
    const snapCol = (c) => ({docs: Object.entries(data[c] || {}).map(([id, v]) => ({id, data: () => v}))});
    const fire = (key, c, id) => (subs[key] || []).forEach((f) => setTimeout(() => f(id ? {exists: !!(data[c] || {})[id], data: () => data[c][id]} : snapCol(c)), 0));
    const touch = (c, id) => { fire(c, c); fire(c + "/" + id, c, id); };
    return {
      collection: (c) => ({ onSnapshot(fn){ (subs[c] = subs[c] || []).push(fn); setTimeout(() => fn(snapCol(c)), 0); } }),
      doc: (path) => { const [c, id] = path.split("/"); return {
        async set(v){ data[c] = data[c] || {}; data[c][id] = JSON.parse(JSON.stringify(v)); save(); touch(c, id); },
        async delete(){ if (data[c]) delete data[c][id]; save(); touch(c, id); },
        onSnapshot(fn){ const k = c + "/" + id; (subs[k] = subs[k] || []).push(fn); setTimeout(() => fn({exists: !!(data[c] || {})[id], data: () => data[c][id]}), 0); }
      }; }
    };
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, RM ? 0 : ms));
  const S = {acts:[], log:[], settings:{goal:2, nudge:3, calDefault:!STANDALONE}, tab:"week", filter:"all", db:null, status:"loading", got:{acts:false, log:false}, anim:false, pending:false, justLogged:"", alertOpen:false, openPlans:new Set()};
  let readyRes; S.readyP = new Promise((r) => { readyRes = r; });

  // ---------- dates ----------
  const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const weekStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return addDays(x, -((x.getDay() + 6) % 7)); };
  const dowIdx = (d) => (d.getDay() + 6) % 7;
  const short = (d) => MON[d.getMonth()] + " " + d.getDate();
  function fmtDay(s){
    const d = parse(s), diff = Math.round((d - today()) / 864e5);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    if (diff === -1) return "Yesterday";
    if (diff > 1 && diff < 7) return DOW[dowIdx(d)] + " " + d.getDate();
    return DOW[dowIdx(d)] + ", " + short(d);
  }
  function fmtTime(t){ if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + pad(m) + " " + ap; }
  const lcDay = (d) => { const t = fmtDay(d); return /^(Today|Tomorrow|Yesterday)$/.test(t) ? t.toLowerCase() : t; };
  const weekLabel = (ws) => { const we = addDays(ws, 6); return ws.getMonth() === we.getMonth() ? short(ws) + " – " + we.getDate() : short(ws) + " – " + short(we); };
  const localStamp = (d) => iso(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00";

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const byDate = (a, b) => (a.date + (a.time || "99")).localeCompare(b.date + (b.time || "99"));
  const openActs = () => S.acts.filter((x) => x.status !== "done");
  const store = {get(k){ try { return localStorage.getItem(k); } catch (e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e){} }};

  // ---------- derived ----------
  function weekInfo(){
    const ws = weekStart(today()), a = iso(ws), b = iso(addDays(ws, 6)), t = iso(today());
    const open = openActs();
    return {
      ws, a, b, t,
      sched: open.filter((x) => x.date && x.date >= t && x.date <= b).sort(byDate),
      overdue: open.filter((x) => x.date && x.date < t).sort(byDate),
      later: open.filter((x) => x.date && x.date > b).sort(byDate),
      done: S.log.filter((l) => l.date >= a && l.date <= b).sort((x, y) => x.date.localeCompare(y.date))
    };
  }
  function countWeek(ws){ const a = iso(ws), b = iso(addDays(ws, 6)); return S.log.filter((l) => l.date >= a && l.date <= b).length; }
  function streak(){
    const g = S.settings.goal; let ws = weekStart(today()), n = 0;
    if (countWeek(ws) >= g) n++;
    ws = addDays(ws, -7);
    for (let i = 0; i < 520; i++){ if (countWeek(ws) >= g){ n++; ws = addDays(ws, -7); } else break; }
    return n;
  }
  function gapInfo(){
    let base = "";
    S.log.forEach((l) => { if (l.date > base) base = l.date; });
    const hasLog = !!base;
    if (!base){
      const first = S.acts.reduce((m, x) => (x.created && (!m || x.created < m)) ? x.created : m, 0);
      if (!first) return null;
      base = iso(new Date(first));
    }
    return {days: Math.max(0, Math.round((today() - parse(base)) / 864e5)), hasLog, base};
  }
  function skipState(w){
    const g = gapInfo(), n = S.settings.nudge, miss = w.overdue[w.overdue.length - 1];
    if (miss) return {level:"skip", miss, g};
    if (g && g.days >= n) return {level:"gap", g};
    if (g && g.days === n - 1) return {level:"soon", g};
    return {level:"ok", g};
  }
  function nextFreeDay(){
    const w = weekInfo(), taken = new Set(openActs().filter((x) => x.date).map((x) => x.date));
    const cands = [];
    for (let i = 0; i < 7; i++){ const d = addDays(w.ws, i); if (iso(d) >= w.t) cands.push(d); }
    const weekend = cands.filter((d) => dowIdx(d) >= 5 && !taken.has(iso(d)));
    if (weekend.length) return iso(weekend[0]);
    const any = cands.find((d) => !taken.has(iso(d)));
    return any ? iso(any) : iso(addDays(w.ws, 12));
  }
  // Sunday planning: Sat and Sun plan next week, Monday plans the current week
  function sunInfo(){
    const t = today(), d = dowIdx(t);
    let ws;
    if (d === 5 || d === 6) ws = addDays(weekStart(t), 7); else if (d === 0) ws = weekStart(t); else return null;
    const a = iso(ws), b = iso(addDays(ws, 6));
    const planned = openActs().filter((x) => x.date && x.date >= a && x.date <= b).length;
    const need = S.settings.goal - planned;
    if (need <= 0 || store.get("twa_sun") === a) return null;
    return {ws, a, b, need, mon: d === 0};
  }
  const waitingSort = (a, b) => (a.lastDone || iso(new Date(a.created || 0))).localeCompare(b.lastDone || iso(new Date(b.created || 0)));

  // ---------- pieces ----------
  const RC = 2 * Math.PI * 34;
  function ring(done, goal){
    const p = Math.min(1, goal ? done / goal : 0), hit = done >= goal, dash = (RC * p).toFixed(1) + " " + RC.toFixed(1);
    return `<svg class="ring" width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="${done} of ${goal} done this week">
      <circle cx="42" cy="42" r="34" fill="none" stroke="var(--track)" stroke-width="9"/>
      <circle class="arc warm" cx="42" cy="42" r="34" fill="none" stroke="url(#rgWarm)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 42 42)" style="stroke-dasharray:${dash};opacity:${p > 0 ? 1 : 0}"/>
      <circle class="arc ok" cx="42" cy="42" r="34" fill="none" stroke="url(#rgOk)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 42 42)" style="stroke-dasharray:${dash};opacity:${hit ? 1 : 0}"/>
    </svg>`;
  }
  function setRing(svg, p, ok){
    const dash = (RC * p).toFixed(1) + " " + RC.toFixed(1);
    svg.querySelectorAll(".arc").forEach((a) => { a.style.strokeDasharray = dash; });
    svg.querySelector(".warm").style.opacity = p > 0 ? 1 : 0;
    svg.querySelector(".ok").style.opacity = ok ? 1 : 0;
  }
  function setRingNow(svg, p, ok){
    const arcs = svg.querySelectorAll(".arc");
    arcs.forEach((a) => { a.style.transition = "none"; });
    setRing(svg, p, ok); svg.getBoundingClientRect();
    arcs.forEach((a) => { a.style.transition = ""; });
  }
  function actRow(x, opt){
    opt = opt || {};
    const c = catOf(x.cat), open = S.openPlans.has(x.id);
    let when;
    if (x.date) when = fmtDay(x.date) + (x.time ? " · " + fmtTime(x.time) : "");
    else if (x.lastDone) when = "Last done " + short(parse(x.lastDone)) + (x.timesDone > 1 ? " · " + x.timesDone + "×" : "");
    else when = "No date yet";
    const tags = [];
    if (opt.must) tags.push(`<span class="tag must">Don't skip</span>`);
    if (opt.late) tags.push(`<span class="tag late">Missed</span>`);
    if (x.evId && x.date) tags.push(`<span class="tag cal">${IC.cal}Calendar</span>`);
    if (x.repeat === "rotate") tags.push(`<span class="tag">Repeat</span>`);
    return `<div class="arow" data-id="${esc(x.id)}" style="--gc:${c.c}">
      ${opt.noDone ? "" : `<button type="button" class="donebtn" data-done="${esc(x.id)}" aria-label="Mark ${esc(x.name)} done">${IC.check}</button>`}
      <button type="button" class="amain" data-edit="${esc(x.id)}" aria-label="Edit ${esc(x.name)}">${cic(x.cat)}<span class="atxt"><span class="t1">${esc(x.name)}</span><span class="t2${opt.late ? " late" : ""}">${esc(when)} · ${esc(c.name)}</span>${tags.length ? `<span class="tags">${tags.join("")}</span>` : ""}${x.plan && open ? `<span class="plan"><b>The plan</b>${esc(x.plan)}</span>` : ""}</span></button>
      ${(!opt.noDone || x.plan) ? `<span class="aside">${opt.noDone ? "" : `<button type="button" class="planbtn movebtn" data-move="${esc(x.id)}" aria-label="${x.date ? "Move" : "Give a day to"} ${esc(x.name)}">${IC.move}</button>`}${x.plan ? `<button type="button" class="planbtn" data-plan="${esc(x.id)}" aria-expanded="${open}" aria-label="${open ? "Hide" : "Show"} the plan for ${esc(x.name)}">${IC.chevd}</button>` : ""}</span>` : ""}
    </div>`;
  }
  function alertBox(kind, title, line, body, actions){
    const open = S.alertOpen;
    return `<section class="alert${kind ? " " + kind : ""}" role="alert"><button type="button" class="ahead" data-alert aria-expanded="${open}"><span class="at">${IC.alert}${title}</span><span class="aline">${line}</span><span class="achev">${IC.chevd}</span></button>${open ? `<div class="abody"><p>${body}</p><div class="acts">${actions}</div></div>` : ""}</section>`;
  }
  const head = (title, sub, extra) => `<div class="headrow"><div class="head"><h1>${title}</h1><span class="date">${sub}</span></div>${extra || ""}</div>`;
  const syncNote = () => S.status === "offline" ? `<div class="notice soft"><span>Not syncing right now. Changes stay on this screen only and won't be kept after you close it.</span></div>` : "";

  // ---------- views ----------
  function viewWeek(){
    const w = weekInfo(), g = S.settings.goal, done = w.done.length, st = streak();
    const left = Math.max(0, g - done), slots = Math.max(0, g - done - w.sched.length);
    let msg;
    if (done >= g) msg = done > g ? `Goal beat by ${done - g}` : "Goal hit";
    else if (slots === 0) msg = `${left} to go · all planned`;
    else msg = `${left} to go · ${slots} need${slots === 1 ? "s" : ""} a date`;
    const sk = skipState(w), gi = sk.g, nd = S.settings.nudge;
    let chip = "";
    if (st) chip += `<span class="lastone">Streak: ${st} wk</span>`;
    if (gi && gi.hasLog) chip += `<span class="lastone${gi.days >= nd ? " bad" : gi.days === nd - 1 ? " warn" : ""}">Last one: ${gi.days === 0 ? "today" : gi.days === 1 ? "yesterday" : gi.days + " days ago"}</span>`;
    let h = head("This week", weekLabel(w.ws), `<button type="button" class="iconbtn" data-settings aria-label="Goal, reminders and how it works">${IC.gear}</button>`);
    h += syncNote();
    if (S.status !== "loading"){
      if (sk.level === "skip"){
        const m = sk.miss, extra = w.overdue.length > 1 ? ` That's ${w.overdue.length} missed plans now.` : "";
        h += alertBox("", "Don't skip twice", `Missed ${esc(m.name)} · ${esc(fmtDay(m.date))}`, `One miss is an accident. Two is the start of a habit.${extra} Put it back on the calendar.`, `<button type="button" class="pillbtn" data-resched="${esc(m.id)}">Move to tomorrow</button><button type="button" class="pillbtn ghost" data-done="${esc(m.id)}">I did it</button>`);
      } else if (sk.level === "gap"){
        h += alertBox("", `${gi.days} days, nothing done`, "Plan one for today or tomorrow", `${gi.hasLog ? `Your last activity was ${gi.days} days ago.` : `You added your list ${gi.days} days ago and haven't logged anything yet.`} Don't let one skip turn into two.`, `<button type="button" class="pillbtn" data-day="${w.t}">Plan for today</button><button type="button" class="pillbtn ghost" data-day="${iso(addDays(today(), 1))}">Tomorrow</button>`);
      } else if (sk.level === "soon" && !w.sched.some((x) => x.date <= iso(addDays(today(), 1)))){
        h += alertBox("soon", "Heads up", `Tomorrow makes ${nd} days without one`, "Nothing is planned for today or tomorrow yet.", `<button type="button" class="pillbtn" data-day="${iso(addDays(today(), 1))}">Plan for tomorrow</button>`);
      }
      const si = sunInfo();
      if (si) h += `<div class="notice"><span><b>${si.mon ? "Monday plan" : "Sunday plan"}</b>Pick ${si.need} for ${si.mon ? "this" : "next"} week</span><span class="nbtns"><button type="button" class="pillbtn" data-sunday>Plan</button><button type="button" class="x" data-sunx="${si.a}" aria-label="Hide until next week">${IC.close}</button></span></div>`;
    }
    h += `<section class="card hero" aria-label="Weekly progress">${ring(done, g)}<div class="txt"><div class="big${done >= g ? " hit" : ""}">${done}<small> / ${g}</small></div><div class="sub">${done >= g ? badge() + badge() : ""}<span>${msg}</span></div>${chip ? `<div class="chiprow">${chip}</div>` : ""}</div></section>`;
    const mustId = (sk.level !== "ok" && w.sched[0]) ? w.sched[0].id : "";

    // strip
    h += `<div class="strip" role="group" aria-label="Days this week">`;
    for (let i = 0; i < 7; i++){
      const d = addDays(w.ws, i), ds = iso(d), past = ds < w.t;
      const dots = openActs().filter((x) => x.date === ds).map(() => `<i class="o"></i>`)
        .concat(S.log.filter((l) => l.date === ds).map(() => `<i></i>`)).slice(0, 3).join("");
      const cls = "day" + (ds === w.t ? " today" : "") + (past ? " past" : "");
      const inner = `<span class="dl">${DOW[i].slice(0, 2)}</span><span class="dn">${d.getDate()}</span><span class="dots">${dots}</span>`;
      h += past ? `<div class="${cls}">${inner}</div>` : `<button type="button" class="${cls}" data-day="${ds}" aria-label="Plan something for ${DOW[i]} ${short(d)}">${inner}</button>`;
    }
    h += `</div>`;

    if (S.status === "loading"){ h += `<p class="empty">Loading your list…</p>`; return h; }
    if (!S.acts.length && !S.log.length){
      h += `<div class="notice"><span><b>Start here</b>Add something you keep putting off</span><button type="button" class="pillbtn" data-add>Add one</button></div>`;
      return h;
    }
    if (slots > 0 && done < g && sk.level === "ok" && !sunInfo()){
      h += `<div class="notice"><span><b>${slots} open slot${slots === 1 ? "" : "s"}</b>Give an idea a day</span><button type="button" class="pillbtn" data-pick>Plan one</button></div>`;
    }
    if (w.overdue.length){
      h += `<div class="sechead"><h2>Slipped</h2><span>reschedule or mark done</span></div><div class="list">${w.overdue.map((x) => actRow(x, {late:true})).join("")}</div>`;
    }
    h += `<div class="sechead"><h2>Planned</h2><span>${w.sched.length} this week</span></div>`;
    h += w.sched.length ? `<div class="list">${w.sched.map((x) => actRow(x, {must: x.id === mustId})).join("")}</div>` : `<p class="empty">Nothing planned for the rest of the week. Tap a day above.</p>`;
    h += `<div class="sechead"><h2>Done this week</h2><span id="doneN">${w.done.length}</span></div>`;
    h += w.done.length ? `<div class="logcard">${w.done.map(logRow).join("")}</div>` : `<p class="empty">Nothing yet this week.</p>`;
    if (w.later.length){
      h += `<div class="sechead"><h2>Coming up</h2><span>after this week</span></div><div class="list">${w.later.slice(0, 4).map((x) => actRow(x)).join("")}</div>`;
    }
    return h;
  }

  function viewIdeas(){
    const open = openActs(), f = S.filter;
    const pass = (x) => f === "all" || x.cat === f;
    const need = open.filter((x) => !x.date && pass(x)).sort((a, b) => waitingSort(a, b) || (a.created || 0) - (b.created || 0));
    const dated = open.filter((x) => x.date && pass(x)).sort(byDate);
    const fin = S.acts.filter((x) => x.status === "done" && pass(x));
    let h = head("Ideas", `${open.filter((x) => !x.date).length} waiting · ${open.filter((x) => x.date).length} planned`);
    h += syncNote();
    h += `<div class="filters" role="group" aria-label="Filter by category"><button type="button" class="chip" data-filter="all" aria-pressed="${f === "all"}">All</button>${CATS.map((c) => `<button type="button" class="chip" data-filter="${c.id}" aria-pressed="${f === c.id}">${CI[c.id]}${c.name}</button>`).join("")}</div>`;
    if (S.status === "loading"){ h += `<p class="empty">Loading your list…</p>`; return h; }
    h += `<div class="sechead"><h2>Needs a date</h2><span>${need.length}</span></div>`;
    h += need.length ? `<div class="list">${need.map((x) => actRow(x)).join("")}</div>` : `<p class="empty">${open.length ? "Everything here has a date. Nice." : "No ideas yet. Use + to add the first one."}</p>`;
    if (dated.length) h += `<div class="sechead"><h2>Planned</h2><span>${dated.length}</span></div><div class="list">${dated.map((x) => actRow(x, {late: x.date < iso(today())})).join("")}</div>`;
    if (fin.length) h += `<div class="sechead"><h2>Finished</h2><span>one-time, done</span></div><div class="list">${fin.map((x) => actRow(x, {noDone:true})).join("")}</div>`;
    return h;
  }

  function logRow(l){
    const c = catOf(l.cat);
    return `<button type="button" class="logrow" data-log="${esc(l.id)}" aria-label="Edit entry for ${esc(l.name)}">${cic(l.cat)}<span class="atxt"><span class="t1">${esc(l.name)}</span><span class="t2">${esc(DOW[dowIdx(parse(l.date))] + ", " + short(parse(l.date)))} · ${esc(c.name)}</span>${l.note ? `<span class="t3 clamp">${esc(l.note)}</span>` : ""}</span><span class="chev">${IC.chev}</span></button>`;
  }

  function bars(){
    const g = S.settings.goal, ws0 = weekStart(today()), weeks = [];
    for (let i = 7; i >= 0; i--){ const ws = addDays(ws0, -7 * i); weeks.push({ws, n: countWeek(ws)}); }
    const max = Math.max(g, ...weeks.map((w) => w.n), 1);
    const W = 320, H = 120, top = 14, bot = 22, plotH = H - top - bot, bw = 24, gap = (W - 8 * bw) / 8;
    const y = (v) => top + plotH - (v / max) * plotH;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Activities done per week, last 8 weeks, goal ${g}" style="display:block"><defs><linearGradient id="bgWarm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6A4BFF"/><stop offset="1" stop-color="#C08BFF"/></linearGradient><linearGradient id="bgOk" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C08BFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>`;
    weeks.forEach((w, i) => {
      const x = gap / 2 + i * (bw + gap), h = Math.max(w.n ? 3 : 0, (w.n / max) * plotH), cur = i === 7;
      s += `<rect x="${x}" y="${top}" width="${bw}" height="${plotH}" rx="6" fill="var(--track)"/>`;
      if (w.n) s += `<rect x="${x}" y="${(top + plotH - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="6" fill="url(#${w.n >= g ? "bgOk" : "bgWarm"})" opacity="${cur ? 1 : .85}"/>`;
      s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="${cur ? "var(--fg)" : "var(--muted)"}" font-weight="${cur ? 700 : 500}">${(w.ws.getMonth() + 1) + "/" + w.ws.getDate()}</text>`;
      if (w.n) s += `<text x="${x + bw / 2}" y="${(top + plotH - h - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--fg)" font-weight="700">${w.n}</text>`;
    });
    s += `<line x1="0" x2="${W}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--fg)" stroke-opacity=".5" stroke-dasharray="4 4"/>`;
    return s + `</svg>`;
  }

  function viewDone(){
    const g = S.settings.goal, w = weekInfo(), st = streak();
    let h = head("Done", `${S.log.length} logged in total`);
    h += syncNote();
    h += `<div class="stats"><div class="stat"><span class="l">This week</span><span class="v">${w.done.length} / ${g}</span></div><div class="stat"><span class="l">Streak</span><span class="v">${st} wk</span></div><div class="stat"><span class="l">All time</span><span class="v">${S.log.length}</span></div></div>`;
    h += `<section class="card" aria-label="Last 8 weeks" style="display:flex;flex-direction:column;gap:10px"><div class="sechead" style="margin:0"><h2>Last 8 weeks</h2><span>dashed line = goal of ${g}</span></div>${bars()}</section>`;
    if (S.status === "loading"){ h += `<p class="empty">Loading…</p>`; return h; }
    if (!S.log.length){ h += `<p class="empty">Nothing logged yet. Tap the check on any planned activity when you do it.</p>`; return h; }
    const groups = new Map();
    S.log.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach((l) => { const k = iso(weekStart(parse(l.date))); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); });
    groups.forEach((list, k) => {
      const ws = parse(k), hit = list.length >= g;
      h += `<div class="gtitle"><span>${weekLabel(ws)}</span><span style="color:${hit ? "var(--ok)" : "var(--muted)"}">· ${list.length}/${g}${hit ? " goal hit" : ""}</span></div><div class="logcard">${list.map(logRow).join("")}</div>`;
    });
    return h;
  }

  function render(){
    if (S.anim){ S.pending = true; return; }
    S.pending = false;
    const app = document.getElementById("app");
    app.innerHTML = S.tab === "ideas" ? viewIdeas() : S.tab === "done" ? viewDone() : viewWeek();
    document.querySelectorAll(".tab").forEach((t) => { if (t.dataset.tab === S.tab) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    if (S.justLogged){
      const el = app.querySelector(`[data-log="${S.justLogged}"]`);
      S.justLogged = "";
      if (el && !RM){
        el.animate([{opacity:0, transform:"translateX(-14px)"},{opacity:1, transform:"none"}], {duration:300, easing:"cubic-bezier(.2,.8,.2,1)"});
        const n = document.getElementById("doneN"); if (n) pop(n, 1.5);
      }
    }
  }

  // ---------- data writes ----------
  async function putAct(a){
    const i = S.acts.findIndex((x) => x.id === a.id);
    if (i >= 0) S.acts[i] = a; else S.acts.push(a);
    render();
    if (!S.db) return true;
    const {id, ...body} = a;
    try { await S.db.doc("acts/" + id).set(body); return true; } catch (e){ toast("Couldn't save that. Try again."); return false; }
  }
  async function delAct(id){
    S.acts = S.acts.filter((x) => x.id !== id); render();
    if (S.db) try { await S.db.doc("acts/" + id).delete(); } catch (e){ toast("Couldn't delete that. Try again."); }
  }
  async function putLog(l){
    const i = S.log.findIndex((x) => x.id === l.id);
    if (i >= 0) S.log[i] = l; else S.log.push(l);
    render();
    if (!S.db) return;
    const {id, ...body} = l;
    try { await S.db.doc("log/" + id).set(body); } catch (e){ toast("Couldn't log that. Try again."); }
  }
  async function delLog(id){
    S.log = S.log.filter((x) => x.id !== id); render();
    if (S.db) try { await S.db.doc("log/" + id).delete(); } catch (e){ toast("Couldn't remove that. Try again."); }
  }
  async function putSettings(){
    render();
    if (S.db) try { await S.db.doc("config/settings").set(S.settings); } catch (e){ toast("Couldn't save that setting. Try again."); }
  }

  // ---------- calendar sync (Google Calendar connector, one-way) ----------
  const CAL = "Google Calendar";
  let mcpP = null;
  const getMcp = () => mcpP || (mcpP = (async () => { try { return window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch (e){ return null; } })());
  function calErr(e){
    const c = e && e.code;
    if (c === "server_not_connected" || c === "server_not_found") return "To sync, add Google Calendar in claude.ai Settings > Connectors.";
    if (c === "needs_reauth") return "Reconnect Google Calendar in claude.ai Settings > Connectors to keep syncing.";
    if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "Calendar sync needs your OK. Allow Google Calendar when Claude asks.";
    if (c === "selection_required") return "Choose which Google Calendar connection to use when Claude asks.";
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "Calendar sync only works when you open the app in Claude.";
    return "Couldn't update your calendar. Your plan is still saved.";
  }
  function findId(p){
    try {
      if (typeof p === "string"){
        try { p = JSON.parse(p); } catch (e){ const m = p.match(/"?(?:eventId|id)"?\s*[:=]\s*"?([A-Za-z0-9_\-]{6,})/); return m ? m[1] : ""; }
      }
      if (!p || typeof p !== "object") return "";
      for (const k of ["eventId", "id"]) if (typeof p[k] === "string" && p[k]) return p[k];
      for (const k of ["event", "result", "data", "item"]) if (p[k] && typeof p[k] === "object"){ const r = findId(p[k]); if (r) return r; }
    } catch (e){}
    return "";
  }
  function evBody(a){
    const description = (a.plan ? a.plan + "\n\n" : "") + "Planned in Twice a Week.";
    let startTime, endTime, allDay = false, minutes;
    if (a.time){
      const s = new Date(a.date + "T" + a.time + ":00");
      startTime = a.date + "T" + a.time + ":00";
      endTime = localStamp(new Date(s.getTime() + 2 * 3600e3));
      if (a.rem === "hour") minutes = 60;
      else if (a.rem === "morning"){ minutes = Math.round((s - new Date(a.date + "T08:00:00")) / 6e4); if (minutes < 30) minutes = 60; }
      else { const n = new Date(a.date + "T20:00:00"); n.setDate(n.getDate() - 1); minutes = Math.round((s - n) / 6e4); }
    } else {
      allDay = true;
      startTime = a.date + "T00:00:00";
      endTime = iso(addDays(parse(a.date), 1)) + "T00:00:00";
      minutes = 240;
    }
    return {summary: a.name, description, startTime, endTime, allDay, useDefaultReminders: false, overrideReminders: [{method: "popup", minutes}]};
  }
  // Returns {evId, changed, msg?, err?}. "unlinked" = event created but its id wasn't readable, so it's left alone afterward.
  async function calSync(a){
    const calOn = a.cal === undefined ? !!a.evId : a.cal;
    const want = !STANDALONE && !!(calOn && a.date && a.status !== "done");
    const ev = a.evId || "";
    if (!want && !ev) return {evId:"", changed:false};
    if (ev === "unlinked") return want ? {evId:ev, changed:false} : {evId:"", changed:true};
    const m = await getMcp();
    if (!m) return {evId:ev, changed:false, err: STANDALONE ? "" : "Calendar sync only works when you open the app in Claude."};
    try {
      if (!want){
        await m.callTool(CAL, "delete_event", {eventId: ev, notificationLevel: "NONE"});
        return {evId:"", changed:true, msg:"Removed from your calendar."};
      }
      const body = evBody(a);
      if (ev){
        await m.callTool(CAL, "update_event", Object.assign({eventId: ev, notificationLevel: "NONE"}, body));
        return {evId:ev, changed:false, msg:"Calendar updated."};
      }
      const r = await m.callTool(CAL, "create_event", body);
      const id = findId(r && (r.payload !== undefined ? r.payload : r.structuredContent)) || findId(r && r.content && r.content[0] && r.content[0].text);
      return {evId: id || "unlinked", changed:true, msg: id ? "Added to your calendar." : "Added to your calendar. Later edits to this one won't sync."};
    } catch (e){
      if (!want && e && e.code === "tool_error") return {evId:"", changed:true};
      return {evId:ev, changed:false, err:calErr(e)};
    }
  }
  // Save an activity, then sync its calendar event and store the event id.
  async function saveWithCal(a, baseMsg){
    await putAct(a);
    const r = await calSync(a);
    if (r.changed){ const cur = S.acts.find((x) => x.id === a.id); if (cur) await putAct(Object.assign({}, cur, {evId: r.evId})); }
    if (r.err) toast((baseMsg ? baseMsg + " " : "") + r.err, null, 6000);
    else if (baseMsg) toast(baseMsg + (r.msg ? " " + r.msg : ""));
    return r;
  }

  // ---------- motion helpers ----------
  const pop = (el, s) => RM ? null : el.animate([{transform:"scale(1)"},{transform:`scale(${s || 1.12})`},{transform:"scale(1)"}], {duration:340, easing:"cubic-bezier(.3,1.4,.5,1)"});
  const ctr = (el) => { const r = el.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };
  async function fly(from, to, mint){
    const a = ctr(from), b = ctr(to), d = document.createElement("div");
    d.className = "flydot" + (mint ? " mint" : ""); d.style.left = (a.x - 7) + "px"; d.style.top = (a.y - 7) + "px"; document.body.appendChild(d);
    const dx = b.x - a.x, dy = b.y - a.y;
    await d.animate([
      {transform:"translate(0,0) scale(.6)", opacity:0},
      {transform:"translate(0,0) scale(1.2)", opacity:1, offset:.12},
      {transform:`translate(${dx * .45}px,${dy * .5 - 46}px) scale(1.1)`, opacity:1, offset:.55},
      {transform:`translate(${dx}px,${dy}px) scale(.5)`, opacity:.3}
    ], {duration:560, easing:"cubic-bezier(.45,0,.25,1)", fill:"forwards"}).finished;
    d.remove();
  }
  async function collapse(el){
    const h = el.offsetHeight;
    await el.animate([{height:h + "px", opacity:1, marginBottom:"0px"},{height:"0px", opacity:0, marginBottom:"-10px", paddingTop:"0px", paddingBottom:"0px", borderWidth:"0px"}], {duration:320, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"}).finished;
  }

  // ---------- completing an activity: check + strike, spark to ring, slide into Done ----------
  async function completeAct(id){
    const x = S.acts.find((a) => a.id === id);
    if (!x || S.anim) return;
    const g = S.settings.goal, before = weekInfo().done.length, after = before + 1, hitNow = after === g;
    const row = document.querySelector(`#app .arow[data-id="${CSS.escape(id)}"]`);
    if (row && !RM){
      S.anim = true;
      try {
        const chk = row.querySelector(".donebtn");
        if (chk){
          chk.classList.add("press"); await sleep(110); chk.classList.remove("press");
          if (hitNow) chk.classList.add("mint");
          chk.classList.add("on");
        }
        row.classList.add("glow");
        await sleep(140);
        row.classList.add("struck");
        await sleep(260);
        const ringEl = document.querySelector("#app .hero .ring");
        if (ringEl && chk && S.tab === "week"){
          await fly(chk, ringEl, after >= g);
          setRing(ringEl, Math.min(1, after / g), after >= g); pop(ringEl, hitNow ? 1.14 : 1.1);
          const big = document.querySelector("#app .hero .big");
          if (big){ big.innerHTML = `${after}<small> / ${g}</small>`; if (after >= g) big.classList.add("hit"); pop(big, hitNow ? 1.25 : 1.18); }
          if (hitNow){
            const hero = document.querySelector("#app .hero"); hero.classList.remove("glow"); void hero.offsetWidth; hero.classList.add("glow");
            const sub = hero.querySelector(".sub");
            sub.innerHTML = `${badge()}${badge()}<span>Goal hit</span>`;
            sub.querySelectorAll(".badge").forEach((b, i) => b.animate([{transform:"scale(0)"},{transform:"scale(1.3)", offset:.6},{transform:"scale(1)"}], {duration:320, delay:i * 140, easing:"ease-out", fill:"backwards"}));
            await sleep(420);
          } else await sleep(120);
        }
        await row.animate([{transform:"none", opacity:1},{transform:"translateX(110%)", opacity:0}], {duration:320, easing:"cubic-bezier(.5,0,.75,0)", fill:"forwards"}).finished;
        await collapse(row);
      } catch (e){}
      S.anim = false;
    }
    const date = iso(today());
    const early = !!(x.evId && x.evId !== "unlinked" && x.date && x.date > date);
    const upd = Object.assign({}, x, {timesDone:(x.timesDone || 0) + 1, lastDone: date > (x.lastDone || "") ? date : x.lastDone, evId:""});
    if (x.repeat === "rotate"){ upd.date = ""; upd.time = ""; upd.status = "open"; } else upd.status = "done";
    const log = {id: uid(), actId: x.id, name: x.name, cat: x.cat, date, note: "",
      prev: {date: x.date || "", time: x.time || "", status: x.status || "open", repeat: x.repeat || "once", lastDone: x.lastDone || "", timesDone: x.timesDone || 0, evId: early ? "" : (x.evId || "")}};
    S.justLogged = log.id;
    S.anim = true; // batch both writes into one render
    const p1 = putAct(upd), p2 = putLog(log);
    S.anim = false; render();
    await Promise.all([p1, p2]);
    // done early: the future calendar event is no longer needed
    if (early) calSync(Object.assign({}, x, {cal:false}));
    toast(hitNow ? "That's your goal for the week." : "Logged.", [
      {label:"Add note", fn: () => openLog(log.id)},
      {label:"Undo", fn: () => restoreLog(log)}
    ], 5000);
  }

  // Put a completed activity back exactly as it was before the check was tapped.
  async function restoreLog(l){
    const cur = S.acts.find((a) => a.id === l.actId);
    await delLog(l.id);
    if (!l.prev){ toast("Entry removed."); return; }
    const base = cur || {id: l.actId, name: l.name, cat: l.cat, plan: "", link: "", created: Date.now(), cal: S.settings.calDefault, rem: "night"};
    const back = Object.assign({}, base, l.prev);
    await saveWithCal(back, back.date ? "Back on your plan for " + lcDay(back.date) + "." : "Back in your ideas.");
  }

  // ---------- sheets ----------
  let sheetEl = null;
  function closeSheet(){ if (sheetEl){ sheetEl.remove(); sheetEl = null; if (S.pending) render(); } }
  function openSheet(inner, label){
    if (sheetEl){ sheetEl.remove(); sheetEl = null; }
    const s = document.createElement("div");
    s.className = "scrim";
    s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab"></div>${inner}</div>`;
    s.addEventListener("click", (e) => { if (e.target === s || e.target.closest("[data-close]")) closeSheet(); });
    document.body.appendChild(s); sheetEl = s;
    return s.querySelector(".sheet");
  }
  const sheetHead = (t) => `<div class="headrow" style="align-items:center"><h2>${t}</h2><button type="button" class="iconbtn" data-close aria-label="Close">${IC.close}</button></div>`;

  function quickDates(){
    const t = today(), ws = weekStart(t), out = [{l:"Today", v:iso(t)}, {l:"Tomorrow", v:iso(addDays(t, 1))}];
    const sat = addDays(ws, 5), sun = addDays(ws, 6);
    if (iso(sat) > iso(addDays(t, 1))) out.push({l:"Sat " + sat.getDate(), v:iso(sat)});
    if (iso(sun) > iso(addDays(t, 1))) out.push({l:"Sun " + sun.getDate(), v:iso(sun)});
    out.push({l:"Next Sat", v:iso(addDays(ws, 12))});
    return out;
  }

    const pick = (wrap, v) => wrap.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
    let cat = d.cat, rep = d.repeat === "rotate" ? "rotate" : "once", rem = d.rem || "night", cal = !!d.cal;

    function syncCalUI(){
      calWrap.hidden = !dateIn.value || STANDALONE;
      sw.setAttribute("aria-checked", String(cal));

    if (x){

  function openLog(logId){
    const l = S.log.find((x) => x.id === logId); if (!l) return;
    const t = iso(today());
    const sh = openSheet(`${sheetHead("Logged")}
      <div style="display:flex;align-items:center;gap:10px">${cic(l.cat)}<span class="t1" style="font-size:18px">${esc(l.name)}</span></div>
      <div><label class="lbl" for="l-date">Day you did it</label><input type="date" class="field" id="l-date" value="${esc(l.date)}" max="${t}"></div>
      <div><label class="lbl" for="l-note">How was it?</label><textarea class="field" id="l-note" placeholder="Worth it? Do it again? Anything to change next time?">${esc(l.note || "")}</textarea></div>
      <button type="button" class="save" id="l-save">Save</button>
      ${l.prev ? `<div><button type="button" class="save ghost" id="l-back">Not done, put it back</button><p class="hint">Removes this entry and puts the plan back the way it was${l.prev.date ? " (" + esc(fmtDay(l.prev.date) + (l.prev.time ? " · " + fmtTime(l.prev.time) : "")) + ")" : ""}.</p></div>` : ""}

  function openPicker(date){
    const ideas = openActs().filter((x) => !x.date).sort(waitingSort);
    const d = date || nextFreeDay();
    const sh = openSheet(`${sheetHead("Plan for " + fmtDay(d))}
      ${ideas.length ? `<p class="hint" style="margin:0;font-size:13px">Pick one. You can set the time and plan on the next screen.</p><div class="list">${ideas.map((x) => `<button type="button" class="prow" data-id="${esc(x.id)}">${cic(x.cat)}<span class="ptx"><b>${esc(x.name)}</b><span>${esc(catOf(x.cat).name)}${x.lastDone ? " · last done " + short(parse(x.lastDone)) : ""}</span></span><span></span></button>`).join("")}</div>` : `<p class="hint" style="margin:0;font-size:13px">No unplanned ideas left. Add something new for this day.</p>`}
      <button type="button" class="save${ideas.length ? " ghost" : ""}" id="p-new">Add something new</button>`, "Plan an activity");
    sh.addEventListener("click", (e) => { const b = e.target.closest(".prow"); if (b) openEdit(b.dataset.id, {date: d}); });
    sh.querySelector("#p-new").addEventListener("click", () => openEdit(null, {date: d}));
  }

  // ---------- Sunday planning ----------
  function openSunday(){
    const si = sunInfo(); if (!si) return;
    const P = {step:1, picks:[], days:{}};
    const ideas = openActs().filter((x) => !x.date).sort(waitingSort);
    const tIso = iso(today());
    const days = Array.from({length:7}, (_, i) => addDays(si.ws, i));
    const ago = (s) => { const n = Math.round((today() - parse(s)) / 864e5); return n <= 0 ? "today" : n === 1 ? "yesterday" : n < 14 ? n + " days ago" : Math.round(n / 7) + " weeks ago"; };
    function suggest(){
      const used = new Set();
      P.picks.forEach((id) => {
        if (P.days[id] != null){ used.add(P.days[id]); return; }
        const x = S.acts.find((a) => a.id === id);
        const order = x && x.cat === "outdoors" ? [5, 6, 4, 2, 3, 1, 0] : [2, 3, 1, 4, 5, 6, 0];
        const k = order.find((i) => !used.has(i) && iso(days[i]) >= tIso);
        P.days[id] = k == null ? 6 : k; used.add(P.days[id]);
      });
    }
    const sh = openSheet(`<div id="sun-body" style="display:flex;flex-direction:column;gap:14px"></div>`, "Plan the week");
    const body = sh.querySelector("#sun-body");
    function draw(){
      let h = "";
      if (P.step === 1){
        h += `<div class="shh"><h2>Pick ${si.need} for ${si.mon ? "this" : "next"} week</h2><span>${P.picks.length} of ${si.need}</span></div>`;
        if (!ideas.length) h += `<p class="hint" style="margin:0;font-size:13px">Your ideas list is empty. Add something you've been putting off first.</p>`;
        h += ideas.map((x) => { const on = P.picks.includes(x.id); return `<button type="button" class="prow" data-pick="${esc(x.id)}" aria-pressed="${on}" ${!on && P.picks.length >= si.need ? "disabled" : ""}>${cic(x.cat)}<span class="ptx"><b>${esc(x.name)}</b><span>${x.lastDone ? "Last done " + ago(x.lastDone) : "Added " + ago(iso(new Date(x.created || Date.now())))}</span></span><span class="pc">${IC.check}</span></button>`; }).join("");
        h += `<div class="btnrow">${ideas.length ? `<button type="button" data-s="auto">Pick for me</button>` : ""}<button type="button" data-s="new">Add new idea</button></div>`;
        h += `<button type="button" class="save" data-s="next" ${P.picks.length ? "" : "disabled"}>Next</button>`;
      } else if (P.step === 2){
        h += `<div class="shh"><h2>Give them days</h2><span>${weekLabel(si.ws)}</span></div>`;
        h += P.picks.map((id) => { const x = S.acts.find((a) => a.id === id); return `<div class="dblock"><span class="nm">${cic(x.cat)}${esc(x.name)}</span><div class="dchips">${days.map((d, k) => `<button type="button" class="dc" data-day="${esc(id)}:${k}" aria-pressed="${P.days[id] === k}" ${iso(d) < tIso ? "disabled" : ""}>${DOW[k].slice(0, 2)}<b>${d.getDate()}</b></button>`).join("")}</div></div>`; }).join("");
        h += `<p class="hint" style="margin:0">Suggested days are filled in. Add times later from each card.</p>`;
        h += `<div class="btnrow"><button type="button" data-s="back">Back</button><button type="button" class="save" data-s="lock">Lock it in</button></div>`;
      } else {
        const anyCal = P.picks.some((id) => { const x = S.acts.find((a) => a.id === id); return x && x.cal; });
        h += `<div class="setcard"><svg width="72" height="44" viewBox="0 0 72 44" aria-hidden="true"><circle cx="20" cy="22" r="19" fill="url(#rgOk)"/><circle cx="52" cy="22" r="19" fill="url(#rgOk)"/><path d="M12 22l6 6 10-11M44 22l6 6 10-11" fill="none" stroke="#050506" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="big2">${si.mon ? "This" : "Next"} week is set</span><span class="hint" style="margin:0">On the calendar. Show up.</span></div>`;
        h += `<div class="list">${P.picks.map((id) => { const x = S.acts.find((a) => a.id === id); return x ? `<div class="arow" style="padding:14px 16px;gap:12px">${cic(x.cat)}<div class="atxt"><span class="t1">${esc(x.name)}</span><span class="t2">${esc(fmtDay(x.date))} · ${esc(catOf(x.cat).name)}</span></div></div>` : ""; }).join("")}</div>`;
        if (anyCal) h += `<div class="syncline">${IC.calok}<span id="sun-sync">Adding to your Google Calendar…</span></div>`;
        h += `<button type="button" class="save" data-close>Done</button>`;
      }
      body.innerHTML = h;
      if (P.step === 3 && !RM){ const svg = body.querySelector(".setcard svg"); svg.animate([{transform:"scale(.4)", opacity:0},{transform:"scale(1.1)", opacity:1, offset:.7},{transform:"scale(1)"}], {duration:420, easing:"ease-out"}); }
    }
    draw();
    body.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-s],[data-pick],[data-day]"); if (!b || b.disabled) return;
      if (b.dataset.pick){ const id = b.dataset.pick, i = P.picks.indexOf(id); if (i >= 0){ P.picks.splice(i, 1); delete P.days[id]; } else if (P.picks.length < si.need) P.picks.push(id); draw(); return; }
      if (b.dataset.day){ const [id, k] = b.dataset.day.split(":"); P.days[id] = Number(k); draw(); return; }
      const a = b.dataset.s;
      if (a === "auto"){ P.picks = ideas.slice(0, si.need).map((x) => x.id); P.days = {}; draw(); }
      else if (a === "new"){ closeSheet(); openEdit(null); }
      else if (a === "next"){ suggest(); P.step = 2; draw(); }
      else if (a === "back"){ P.step = 1; draw(); }
      else if (a === "lock"){
        const plans = P.picks.map((id) => { const x = S.acts.find((q) => q.id === id); return Object.assign({}, x, {date: iso(days[P.days[id]]), cal: x.cal === undefined ? S.settings.calDefault : x.cal, rem: x.rem || "night"}); });
        plans.forEach((p) => putAct(p));
        P.step = 3; draw();
        let err = "", added = 0;
        for (const p of plans){
          const r = await calSync(p);
          if (r.changed){ const cur = S.acts.find((q) => q.id === p.id); if (cur) await putAct(Object.assign({}, cur, {evId: r.evId})); }
          if (r.err) err = r.err; else if (r.evId) added++;
        }
        const line = document.getElementById("sun-sync");
        if (line) line.textContent = err ? err : added ? "Added to your Google Calendar." : "";
      }
    });
  }

  function openSettings(){
    const sh = openSheet(`${sheetHead("Goal and reminders")}
      <div class="setblock"><span class="lbl" style="margin:0">Weekly goal</span>
      <div class="stepper"><button type="button" id="s-dn" aria-label="Lower goal">−</button><span class="n" id="s-n">${S.settings.goal}</span><button type="button" id="s-up" aria-label="Raise goal">+</button><span class="hint" style="margin:0;font-size:13px">activities per week</span></div></div>

      <div class="setblock"${STANDALONE ? " hidden" : ""}><div class="togrow"><div><b>Add new plans to my calendar</b><span>Google Calendar. You can turn it off per activity.</span></div><button type="button" class="sw" id="s-cal" role="switch" aria-checked="${!!S.settings.calDefault}" aria-label="Add new plans to my calendar"></button></div></div>
      <div class="how">
        <details class="hw"><summary>Never skip twice</summary><p>Miss a planned day and a red alert shows at the top. Tap it for a one-tap reschedule. Your next plan gets a "Don't skip" tag.</p></details>
        <details class="hw"><summary>1. Dump ideas</summary><p>Anything you keep saying "I should do that." Movies, trails, places to eat. No date needed.</p></details>

        <details class="hw"><summary>Weeks and streaks</summary><p>Weeks run Monday to Sunday. Hit your goal in back-to-back weeks to build a streak.</p></details>
      </div>`, "Goal and reminders");
    const n = sh.querySelector("#s-n"), rn = sh.querySelector("#r-n"), sc = sh.querySelector("#s-cal");
    const set = (v) => { S.settings.goal = Math.max(1, Math.min(7, v)); n.textContent = S.settings.goal; putSettings(); };
    const setR = (v) => { S.settings.nudge = Math.max(2, Math.min(7, v)); rn.textContent = S.settings.nudge; putSettings(); };
    sh.querySelector("#s-dn").addEventListener("click", () => set(S.settings.goal - 1));

    sh.querySelector("#r-up").addEventListener("click", () => setR(S.settings.nudge + 1));
