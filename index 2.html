  }

  // ---------- events ----------
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  document.querySelector(".nav").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b && !S.anim){ S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); } });
  document.getElementById("fab").addEventListener("click", () => openEdit(null));
  document.getElementById("app").addEventListener("click", (e) => {
    const t = e.target.closest("button"); if (!t || S.anim) return;
    if (t.hasAttribute("data-alert")){
      S.alertOpen = !S.alertOpen; render();
      const b = document.querySelector("#app .abody");
      if (b && !RM) b.animate([{opacity:0, transform:"translateY(-6px)"},{opacity:1, transform:"none"}], {duration:200, easing:"ease-out"});
      return;
    }
    if (t.dataset.plan){
      const id = t.dataset.plan;
      if (S.openPlans.has(id)) S.openPlans.delete(id); else S.openPlans.add(id);
      render();
      const pl = document.querySelector(`#app .arow[data-id="${CSS.escape(id)}"] .plan`);
      if (pl && !RM) pl.animate([{opacity:0, transform:"translateY(-4px)"},{opacity:1, transform:"none"}], {duration:200, easing:"ease-out"});
      return;
    }
    if (t.dataset.move){ openMove(t.dataset.move); return; }
    if (t.dataset.edit) openEdit(t.dataset.edit);
    else if (t.dataset.done) completeAct(t.dataset.done);
    else if (t.dataset.log) openLog(t.dataset.log);
    else if (t.dataset.day) openPicker(t.dataset.day);
    else if (t.dataset.resched){
      const x = S.acts.find((a) => a.id === t.dataset.resched);
      if (x) saveWithCal(Object.assign({}, x, {date: iso(addDays(today(), 1))}), "Moved to tomorrow. Don't skip this one.");
    }
    else if (t.hasAttribute("data-sunday")) openSunday();
    else if (t.dataset.sunx){ store.set("twa_sun", t.dataset.sunx); render(); toast("Hidden until next weekend."); }
    else if (t.hasAttribute("data-pick")) openPicker();
    else if (t.hasAttribute("data-add")) openEdit(null);
    else if (t.hasAttribute("data-settings")) openSettings();
    else if (t.dataset.filter){ S.filter = t.dataset.filter; render(); }
  });

  let toastTimer;
  function toast(msg, actions, ms){
    let el = document.querySelector(".toast");
    if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.innerHTML = `<span class="tm"></span>`;
    el.querySelector(".tm").textContent = msg;
    (actions || []).forEach((a) => { const b = document.createElement("button"); b.type = "button"; b.textContent = a.label; b.addEventListener("click", () => { el.hidden = true; a.fn(); }); el.appendChild(b); });
    el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms || 2600);
  }

  // ---------- opening: horizon + wordmark (full once a day, ring sweep after that) ----------
  function playSplash(){
    const sp = document.createElement("div");
    sp.className = "splash"; sp.setAttribute("aria-hidden", "true");
    sp.innerHTML = `<div class="sbg"></div><div class="dawn"></div><div class="sky"><div class="sun"></div></div><div class="hz"></div><div class="wm"><div class="w1">${"Twice".split("").map((c) => `<span class="lt">${c}</span>`).join("")}<span class="aw"> a Week</span></div><div class="tag">Surviving isn't living.</div></div>`;
    document.body.appendChild(sp);
    let skipRes; const skipP = new Promise((r) => { skipRes = r; });
    sp.addEventListener("click", () => skipRes());
    const $s = (q) => sp.querySelector(q);
    const sun = $s(".sun"), hz = $s(".hz"), dawn = $s(".dawn"), sky = $s(".sky"), wm = $s(".wm");
    hz.animate([{transform:"scaleX(0)"},{transform:"scaleX(1)"}], {duration:420, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
    dawn.animate([{opacity:0},{opacity:1}], {duration:700, delay:200, fill:"forwards"});
    sun.animate([{transform:"translateY(0)"},{transform:"translateY(-100px)"}], {duration:640, delay:260, easing:"cubic-bezier(.2,.7,.2,1)", fill:"forwards"});
    sp.querySelectorAll(".lt").forEach((l, i) => l.animate([{opacity:0, transform:"translateY(6px)"},{opacity:1, transform:"none"}], {duration:220, delay:560 + i * 70, fill:"forwards"}));
    $s(".aw").animate([{opacity:0},{opacity:1}], {duration:260, delay:920, fill:"forwards"});
    $s(".tag").animate([{opacity:0, transform:"translateY(6px)"},{opacity:1, transform:"none"}], {duration:300, delay:1060, fill:"forwards"});
    return (async () => {
      await Promise.race([new Promise((r) => setTimeout(r, 1580)), skipP]);
      await Promise.race([S.readyP, new Promise((r) => setTimeout(r, 900))]);
      sky.style.overflow = "visible";
      const rg = document.querySelector("#app .hero .ring");
      if (rg){
        const a = ctr(sun), b = ctr(rg);
        sun.getAnimations().forEach((an) => an.commitStyles && an.commitStyles());
        sun.getAnimations().forEach((an) => an.cancel());
        sun.animate([{transform:"translateY(-100px)", opacity:1},{transform:`translate(${b.x - a.x}px,${b.y - a.y - 100}px) scale(.9)`, opacity:0}], {duration:380, easing:"cubic-bezier(.5,0,.25,1)", fill:"forwards"});
      } else sun.animate([{opacity:1},{opacity:0}], {duration:260, fill:"forwards"});
      wm.animate([{opacity:1, transform:"none"},{opacity:0, transform:"translateY(-14px)"}], {duration:260, fill:"forwards"});
      hz.animate([{opacity:1},{opacity:0}], {duration:220, fill:"forwards"});
      dawn.getAnimations().forEach((an) => an.finish());
      dawn.animate([{opacity:1},{opacity:0}], {duration:300, fill:"forwards"});
      $s(".sbg").animate([{opacity:1},{opacity:0}], {duration:320, delay:80, fill:"forwards"});
      setTimeout(() => sp.remove(), 460);
    })();
  }
  async function reveal(full){
    const app = document.getElementById("app");
    if (RM) return;
    if (full) [...app.children].forEach((k, i) => k.animate([{opacity:0, transform:"translateY(12px)"},{opacity:1, transform:"none"}], {duration:340, delay:Math.min(i, 8) * 50 + 60, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards"}));
    const rg = app.querySelector(".hero .ring");
    if (rg){
      const w = weekInfo(), g = S.settings.goal, n = w.done.length;
      setRingNow(rg, 0, false);
      await new Promise((r) => setTimeout(r, full ? 240 : 80));
      setRing(rg, Math.min(1, n / g), n >= g);
    }
    const al = app.querySelector(".alert[role=alert]");
    if (al){
      await new Promise((r) => setTimeout(r, full ? 420 : 300));
      await al.animate([{opacity:0, transform:"translateY(-16px)"},{opacity:1, transform:"none"}], {duration:300, easing:"cubic-bezier(.2,.9,.3,1.2)", fill:"backwards"}).finished;
      al.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(-3px)"},{transform:"translateX(0)"}], {duration:320});
    }
  }
  async function intro(){
    let full = !RM && store.get("twa_intro") !== iso(today());
    if (full){
      store.set("twa_intro", iso(today()));
      const exit = playSplash();
      await new Promise((r) => setTimeout(r, 40));
      await exit;
      reveal(true);
    } else {
      await Promise.race([S.readyP, new Promise((r) => setTimeout(r, 1500))]);
      reveal(false);
    }
  }

  // ---------- boot ----------
  render();
  intro();
  (async () => {
    let db = null;
    if (STANDALONE) db = localDb();
    else try { db = await window.claude.use("db"); } catch (e){ db = null; }
    if (!db){ S.status = "offline"; render(); readyRes(); return; }
    S.db = db;
    const ready = () => { if (S.got.acts && S.got.log && S.status === "loading"){ S.status = "live"; readyRes(); } };
    db.collection("acts").onSnapshot((snap) => {
      S.acts = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      S.got.acts = true; ready(); if (!sheetEl) render(); else S.pending = true;
    }, () => { S.status = "offline"; render(); readyRes(); });
    db.collection("log").onSnapshot((snap) => {
      S.log = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      S.got.log = true; ready(); if (!sheetEl) render(); else S.pending = true;
    }, () => { S.got.log = true; ready(); render(); });
    db.doc("config/settings").onSnapshot((snap) => {
      if (snap.exists){
        const v = snap.data() || {}, g = Number(v.goal), nd = Number(v.nudge);
        if (g >= 1 && g <= 7) S.settings.goal = g;
        if (nd >= 2 && nd <= 7) S.settings.nudge = nd;
        if (typeof v.calDefault === "boolean" && !STANDALONE) S.settings.calDefault = v.calDefault;
      }
      if (!sheetEl) render(); else S.pending = true;
    }, () => {});
  })();
})();
</script>

</body>
